<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0b0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gravemark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Gravemark</title>
<link rel="stylesheet" href="css/main.css?v=b017-paint">
</head>
<body>
<div id="app" data-view="delves">

  <!-- ============ LEFT: the parish ============ -->
  <section id="hub">
    <div id="hubScene">
      <canvas id="hubCanvas"></canvas>

      <div id="hubTop">
        <span class="cur" data-tip="cur:gold"><i class="ci ci-gold"></i><b id="cGold">0</b></span>
        <span class="cur" data-tip="cur:shards"><i class="ci ci-shard"></i><b id="cShards">0</b></span>
        <span class="cur" data-tip="cur:ichor"><i class="ci ci-ichor"></i><b id="cIchor">0</b></span>
        <span class="cur" id="cMarksWrap" hidden data-tip="cur:marks"><i class="ci ci-mark"></i><b id="cMarks">0</b></span>
        <span class="cur" id="cDustWrap" hidden data-tip="cur:dust"><i class="ci ci-dust"></i><b id="cDust">0</b></span>
      </div>

      <div id="hubSide">
        <button class="sideBtn" data-open="settings"><span>&#9881;</span>Settings</button>
        <button class="sideBtn" data-open="codex"><span>&#128220;</span>Codex</button>
        <button class="sideBtn" data-open="manual"><span>&#128214;</span>Manual</button>
        <button class="sideBtn hot" data-open="ascend"><span>&#10022;</span>Ascend</button>
      </div>

      <div id="hubMarkers"></div>

      <div id="questStrip">
        <div class="qtext"><span id="questName">&mdash;</span>
          <span class="qcount"><b id="questDone">0</b>/<span id="questNeed">30</span></span></div>
        <div class="qbar"><div class="qfill" id="questFill"></div></div>
        <div class="qrow">
          <span class="qreward"><i class="ci ci-gold"></i><b id="qrGold">0</b></span>
          <span class="qreward"><i class="ci ci-shard"></i><b id="qrShards">0</b></span>
          <span class="qreward"><i class="ci ci-ichor"></i><b id="qrIchor">0</b></span>
          <button class="btn sm" id="questClaim" disabled>Not Completed</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ CENTRE: three delves ============ -->
  <section id="battles"></section>

  <!-- ============ RIGHT: the warband ============ -->
  <aside id="roster">
    <div id="rosterHead">
      <div class="rh-title">Warband</div>
      <div class="rh-count"><b id="rosterCount">0</b>/<span id="rosterMax">22</span></div>
      <div class="rh-btns">
        <button class="ibtn" id="btnRecruit" data-tip="txt:Recruit a new hero">&#43;</button>
        <button class="ibtn" id="btnAutoAssign" data-tip="txt:Fill squads with the strongest benched heroes">&#9776;</button>
        <button class="ibtn" id="btnNames" data-tip="txt:Names: the epitaphs you hold">&#9998;</button>
      </div>
    </div>
    <div id="rosterList"></div>
  </aside>

  <nav id="mobileTabs">
    <button data-view="parish">Parish</button>
    <button data-view="delves" class="on">Delves</button>
    <button data-view="warband">Warband</button>
  </nav>

</div>

<div id="tip"></div>
<div id="toasts"></div>
<div id="overlayWrap" hidden><div id="overlay"></div></div>

<script src="src/00-util.js?v=b017-paint"></script>
<script src="src/01-data-kit.js?v=b017-paint"></script>
<script src="src/03-data-world.js?v=b017-paint"></script>
<script src="src/04-data-meta.js?v=b017-paint"></script>
<script src="src/05-data-heroes.js?v=b017-paint"></script>
<script src="src/07-data-rig.js?v=b017-paint"></script>
<script src="src/10-state.js?v=b017-paint"></script>
<script src="src/11-stats.js?v=b017-paint"></script>
<script src="src/12-rewards.js?v=b017-paint"></script>
<script src="src/13-combat.js?v=b017-paint"></script>
<script src="src/14-graves.js?v=b017-paint"></script>
<script src="src/15-inscribe.js?v=b017-paint"></script>
<script src="src/16-modes.js?v=b017-paint"></script>
<script src="src/17-offline.js?v=b017-paint"></script>
<script src="src/18-assets.js?v=b017-paint"></script>
<script src="src/20-vfx.js?v=b017-paint"></script>
<script src="src/30-ui.js?v=b017-paint"></script>
<script src="src/31-ui-hub.js?v=b017-paint"></script>
<script src="src/32-ui-battle.js?v=b017-paint"></script>
<script src="src/33-ui-roster.js?v=b017-paint"></script>
<script src="src/34-ui-overlay.js?v=b017-paint"></script>
<script src="src/99-boot.js?v=b017-paint"></script>
</body>
</html>
