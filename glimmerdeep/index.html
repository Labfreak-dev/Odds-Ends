<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glimmerdeep</title>
<meta name="description" content="Tame, evolve and delve: a creature-taming roguelite auto-battler.">
<meta name="theme-color" content="#120d2a">
<link rel="icon" href="img/cr_cind1.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #120d2a; --panel: #231a4a; --panel2: #2e2360; --line: #4d3f8f; --ink: #fff8ec; --dim: #c7bde8;
  --gold: #ffc93c; --good: #4fe07a; --bad: #ff5468; --od: #3fe0ff; --shield: #a9d6ff;
  --ember: #ff7a2a; --tide: #2fa6ff; --bloom: #4fd35a; --volt: #ffd21f; --stone: #c79459; --shade: #8d7bff;
  --r: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 600 15px/1.35 Nunito, system-ui, sans-serif; overflow: hidden; }
body { user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
h1, h2, h3, .fred { font-family: Fredoka, Nunito, sans-serif; margin: 0; letter-spacing: .3px; }
img { display: block; -webkit-user-drag: none; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; max-width: 1180px; margin: 0 auto; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; overflow: hidden; }
.screen.on { display: flex; }
.bgimg { position: absolute; inset: 0; background-size: cover; background-position: center; z-index: 0; }
.bgimg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18,13,42,.15), rgba(18,13,42,.75)); }
.layer { position: relative; z-index: 1; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* buttons and panels */
.btn { background: linear-gradient(180deg, #ffd65a, #ff9f1c); color: #3a1d00; font-family: Fredoka, Nunito, system-ui, sans-serif; font-weight: 700; font-size: 18px;
  padding: 12px 22px; border-radius: 14px; box-shadow: 0 4px 0 #b4600a, 0 8px 18px rgba(0,0,0,.35); transition: transform .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b4600a; }
.btn.blue { background: linear-gradient(180deg, #6fd3ff, #2f8bff); color: #04224a; box-shadow: 0 4px 0 #1a56b0, 0 8px 18px rgba(0,0,0,.35); }
.btn.green { background: linear-gradient(180deg, #84f08f, #2fbf55); color: #06300f; box-shadow: 0 4px 0 #1a7a33, 0 8px 18px rgba(0,0,0,.35); }
.btn.ghost { background: rgba(255,255,255,.1); color: var(--ink); box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); }
.btn.sm { font-size: 14px; padding: 8px 14px; border-radius: 11px; }
.btn[disabled] { filter: grayscale(.8) brightness(.7); pointer-events: none; }
.panel { background: linear-gradient(180deg, var(--panel2), var(--panel)); border-radius: var(--r); box-shadow: inset 0 0 0 2px var(--line), 0 10px 30px rgba(0,0,0,.4); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; background: rgba(0,0,0,.35); font-weight: 800; }
.pill img { width: 20px; height: 20px; }
.row { display: flex; gap: 10px; align-items: center; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.center { justify-content: center; }
.muted { color: var(--dim); }
.small { font-size: 13px; }
.tag { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 99px; background: rgba(255,255,255,.12); text-transform: uppercase; letter-spacing: .4px; }
.el-ember { --c: var(--ember); } .el-tide { --c: var(--tide); } .el-bloom { --c: var(--bloom); }
.el-volt { --c: var(--volt); } .el-stone { --c: var(--stone); } .el-shade { --c: var(--shade); }

/* top bar */
.topbar { display: flex; align-items: center; gap: 8px; padding: max(8px, env(safe-area-inset-top)) 12px 8px; background: linear-gradient(180deg, rgba(10,6,28,.85), rgba(10,6,28,.4)); z-index: 5; position: relative; }
.topbar .title { font-family: Fredoka, Nunito, system-ui, sans-serif; font-size: 17px; font-weight: 700; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.1); display: grid; place-items: center; font-family: Fredoka, Nunito, system-ui, sans-serif; font-weight: 700; font-size: 13px; }
.iconbtn img { width: 30px; height: 30px; }

/* title */
#title .logo { font-family: Fredoka, Nunito, system-ui, sans-serif; font-weight: 700; font-size: clamp(46px, 11vw, 92px); line-height: .95; text-align: center;
  background: linear-gradient(180deg, #fff6a8 10%, #ffb22e 55%, #ff6a3d 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 0 #5a1d6b) drop-shadow(0 10px 18px rgba(0,0,0,.5)); }
#title .sub { text-align: center; font-family: Fredoka, Nunito, system-ui, sans-serif; font-size: 18px; color: #fff; text-shadow: 0 2px 8px #000; margin-top: 6px; }
#title .menu { display: flex; flex-direction: column; gap: 14px; align-items: center; margin-top: 26px; }
#title .menu .btn { min-width: 240px; }
.title-mons { display: flex; justify-content: center; align-items: flex-end; gap: 0; margin-top: 4vh; height: 24vh; }
.title-mons img { height: 100%; max-width: 30vw; object-fit: contain; filter: drop-shadow(0 10px 14px rgba(0,0,0,.5)); animation: bob 2.6s ease-in-out infinite; }
.title-mons img:nth-child(2) { height: 120%; animation-delay: -.8s; }
.title-mons img:nth-child(3) { animation-delay: -1.6s; }
@keyframes bob { 50% { transform: translateY(-8px) scale(1.02); } }

/* cards */
.cards { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; padding: 12px; }
.card { width: min(250px, 44vw); padding: 12px; border-radius: 18px; cursor: pointer; text-align: center; transition: transform .12s;
  background: radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--c, #8d7bff) 45%, transparent), transparent 70%), linear-gradient(180deg, var(--panel2), var(--panel));
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c, #8d7bff) 70%, transparent), 0 10px 26px rgba(0,0,0,.45); }
.card:hover { transform: translateY(-4px); }
.card .art { height: 150px; display: grid; place-items: center; }
.card .art img { max-height: 150px; max-width: 100%; filter: drop-shadow(0 8px 10px rgba(0,0,0,.45)); }
.card .art img.icon { max-height: 96px; }
.card h3 { font-size: 20px; margin-top: 6px; }
.card p { margin: 6px 0 0; font-size: 13px; color: var(--dim); }
.card.sel { box-shadow: inset 0 0 0 3px #fff, 0 0 26px color-mix(in srgb, var(--c, #fff) 80%, transparent); }
.shiny { filter: hue-rotate(150deg) saturate(1.3) drop-shadow(0 0 6px #fff8) !important; }
.badge { width: 22px; height: 22px; display: inline-block; vertical-align: middle; }

/* map */
#map .mapwrap { flex: 1; position: relative; overflow-y: auto; }
#map .mapinner { position: relative; margin: 0 auto; width: min(560px, 100%); }
#map svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.node { position: absolute; width: 62px; height: 62px; margin: -31px 0 0 -31px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 35%, #3a2f78, #1b1440); box-shadow: inset 0 0 0 3px #5b4ca8, 0 6px 14px rgba(0,0,0,.5); transition: transform .15s; }
.node img { width: 46px; height: 46px; }
.node.boss { width: 92px; height: 92px; margin: -46px 0 0 -46px; }
.node.boss img { width: 70px; height: 70px; }
.node.done { filter: grayscale(.9) brightness(.55); }
.node.cur { box-shadow: inset 0 0 0 3px #fff, 0 0 18px #fff8; filter: none; }
.node.can { cursor: pointer; animation: pulse 1.2s ease-in-out infinite; box-shadow: inset 0 0 0 3px var(--gold), 0 0 22px #ffc93c99; }
.node.can:hover { transform: scale(1.12); }
.node.far { opacity: .8; }
.node .pv { position: absolute; bottom: -12px; display: flex; gap: 1px; }
.node .pv img { width: 20px; height: 20px; }
@keyframes pulse { 50% { transform: scale(1.1); } }
.hazard { margin: 8px 12px 0; padding: 10px 14px; display: flex; gap: 12px; align-items: center; }
.hazard .hz { font-family: Fredoka, Nunito, system-ui, sans-serif; font-size: 16px; color: var(--gold); }
.partybar { display: flex; gap: 6px; padding: 8px 10px max(10px, env(safe-area-inset-bottom)); overflow-x: auto; background: linear-gradient(0deg, rgba(10,6,28,.95), rgba(10,6,28,.6)); }
.pm { flex: 0 0 auto; width: 74px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,.07); text-align: center; position: relative; cursor: pointer; }
.pm.bench { opacity: .65; }
.pm img { height: 50px; margin: 0 auto; object-fit: contain; max-width: 66px; }
.pm .lv { font-size: 11px; font-weight: 800; }
.pm.ko img { filter: grayscale(1) brightness(.5); }
.pm .evo { position: absolute; top: 2px; right: 2px; background: var(--gold); color: #3a1d00; font-size: 10px; font-weight: 800; border-radius: 6px; padding: 0 4px; }
.bar { height: 6px; border-radius: 4px; background: rgba(0,0,0,.5); overflow: hidden; position: relative; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--good); border-radius: 4px; transition: width .35s; }
.bar > i.mid { background: #ffd23f; } .bar > i.low { background: var(--bad); }
.bar.xp > i { background: #b98bff; } .bar.od > i { background: var(--od); }

/* battle */
#battle { background: #000; }
.arena { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 64vh; overflow: hidden; flex: 0 0 auto; background-size: cover; background-position: center 65%; }
@media (max-aspect-ratio: 4/5) { .arena { aspect-ratio: 1 / 1; max-height: 54vh; background-position: center 70%; } .mon { width: calc(var(--w, 16%) * 1.38); } .mon.boss { width: calc(var(--w, 16%) * 1.1); } }
.arena::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.25), transparent 30%, transparent 70%, rgba(0,0,0,.35)); pointer-events: none; }
.arena .dim { position: absolute; inset: 0; background: rgba(5,2,20,.65); opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 30; }
.arena.ult .dim { opacity: 1; }
.mon { position: absolute; width: var(--w, 16%); transform: translate(-50%, 0); z-index: 10; cursor: pointer; }
.mon .spr { width: 100%; height: auto; transform-origin: 50% 100%; animation: idle 2.4s ease-in-out infinite; filter: drop-shadow(0 6px 6px rgba(0,0,0,.55)); }
.mon.side1 .spr { transform: scaleX(-1); animation-name: idleF; }
.mon .shadow { position: absolute; left: 15%; right: 15%; bottom: -4%; height: 10%; background: radial-gradient(closest-side, rgba(0,0,0,.55), transparent); z-index: -1; }
@keyframes idle { 50% { transform: scale(1.02, .98) translateY(1%); } }
@keyframes idleF { 0%, 100% { transform: scaleX(-1); } 50% { transform: scaleX(-1) scale(1.02, .98) translateY(1%); } }
.mon.dead { opacity: 0; transform: translate(-50%, 10%) scale(.8); transition: opacity .6s, transform .6s; pointer-events: none; }
.mon.focus .shadow { left: 0; right: 0; bottom: -7%; height: 20%; background: radial-gradient(closest-side, transparent 58%, #ff4d6d 62%, #ffd0d8 70%, #ff4d6d 76%, transparent 80%); animation: ring 1s ease-in-out infinite; }
@keyframes ring { 50% { transform: scale(1.12); opacity: .8; } }
.mon.flash .spr { filter: brightness(2.6) drop-shadow(0 0 8px #fff); }
.mon.elite .spr { filter: drop-shadow(0 0 10px #ffcb3c) drop-shadow(0 6px 6px rgba(0,0,0,.55)); }
.mon.actor { z-index: 40; }
.hud { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); width: max(92px, 100%); pointer-events: none; z-index: 20; }
.hud .nm { display: flex; gap: 3px; align-items: center; font: 700 11px/1 Fredoka, Nunito, system-ui, sans-serif; text-shadow: 0 1px 2px #000, 0 0 4px #000; white-space: nowrap; justify-content: center; }
.hud .nm img { width: 14px; height: 14px; }
.hud .bar { height: 7px; margin-top: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
.hud .bar .sh { background: var(--shield); left: auto; right: 0; opacity: .9; }
.hud .bar.od { height: 4px; }
.hud .sts { display: flex; gap: 2px; justify-content: center; flex-wrap: wrap; margin-top: 2px; min-height: 13px; }
.st { font: 800 9px/1 Nunito, system-ui, sans-serif; padding: 2px 4px; border-radius: 5px; color: #fff; text-shadow: 0 1px 1px #0008; }
.st.burn { background: #e2531b; } .st.poison { background: #7b3fbf; } .st.soak, .st.wet { background: #1f7fd6; } .st.stun { background: #d6b600; color: #2a2300; text-shadow: none; }
.st.root { background: #2f9a3a; } .st.curse { background: #4b2a8a; } .st.blind { background: #555; } .st.buff { background: #1d8f6f; } .st.taunt { background: #b5651d; }
.pop { position: absolute; z-index: 50; transform: translate(-50%, -50%); font: 700 22px/1 Fredoka, Nunito, system-ui, sans-serif; color: #fff; pointer-events: none; white-space: nowrap;
  text-shadow: 0 2px 0 #000, 0 0 6px #000; animation: pop 0.9s ease-out forwards; }
.pop.crit { font-size: 30px; color: #ffe34d; }
.pop.heal { color: #6bff8f; } .pop.shield { color: var(--shield); font-size: 18px; } .pop.miss { color: #ddd; font-size: 17px; }
.pop.small { font-size: 15px; } .pop.eff { font-size: 12px; color: #ffcf6b; }
.pop.react { font-size: 20px; color: #fff; padding: 4px 10px; border-radius: 10px; background: linear-gradient(90deg, #ff5bd1, #6a5bff); text-shadow: 0 2px 0 #0007; animation: react 1.2s ease-out forwards; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -190%) scale(1); } }
@keyframes react { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); } 20% { opacity: 1; transform: translate(-50%, -80%) scale(1.15); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -140%); } }
.orb { position: absolute; z-index: 45; width: 4%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
  background: radial-gradient(circle, #fff 0 20%, var(--c) 45%, transparent 72%); box-shadow: 0 0 18px 6px var(--c); }
.burst { position: absolute; z-index: 44; width: 14%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
  background: radial-gradient(circle, #fff9 0 10%, color-mix(in srgb, var(--c) 80%, transparent) 35%, transparent 70%); animation: burst .45s ease-out forwards; }
@keyframes burst { from { transform: translate(-50%, -50%) scale(.3); opacity: 1; } to { transform: translate(-50%, -50%) scale(1.6); opacity: 0; } }
.banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 60; font: 700 clamp(22px, 5vw, 44px)/1 Fredoka, Nunito, system-ui, sans-serif; white-space: nowrap;
  color: #fff; text-shadow: 0 3px 0 var(--c, #6a5bff), 0 0 20px var(--c, #6a5bff), 0 4px 10px #000; pointer-events: none; animation: banner 1.1s ease-out forwards; }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(2); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(.9); } }
.arena .info { position: absolute; left: 8px; top: 8px; z-index: 35; display: flex; gap: 6px; flex-wrap: wrap; max-width: 70%; }
.arena .info .pill { font-size: 12px; }
.arena .turn { position: absolute; right: 8px; top: 8px; z-index: 35; }
.trait { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: color-mix(in srgb, var(--c) 55%, #000a); box-shadow: inset 0 0 0 1px var(--c); cursor: help; }
.cmd { flex: 1; display: flex; flex-direction: column; background: linear-gradient(180deg, #1d1542, #120d2a); min-height: 0; }
.cmd .rows { flex: 1; overflow-y: auto; padding: 6px 8px 0; }
.crow { display: flex; gap: 6px; align-items: center; padding: 4px 6px; border-radius: 12px; margin-bottom: 4px; background: rgba(255,255,255,.04); }
.crow.dead { opacity: .35; pointer-events: none; }
.crow .who { width: 86px; flex: 0 0 auto; display: flex; gap: 4px; align-items: center; font: 700 12px/1.1 Fredoka, Nunito, system-ui, sans-serif; }
.crow .who img { width: 34px; height: 34px; object-fit: contain; }
.chips { display: flex; gap: 5px; flex: 1; overflow-x: auto; }
.chip { flex: 1 1 0; min-width: 72px; max-width: 170px; padding: 7px 6px; border-radius: 11px; font: 700 12px/1.1 Fredoka, Nunito, system-ui, sans-serif; text-align: center; position: relative;
  background: color-mix(in srgb, var(--c) 22%, #241c4c); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 45%, transparent); color: #fff; }
.chip small { display: block; font: 700 10px/1.1 Nunito, system-ui, sans-serif; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.sel { background: color-mix(in srgb, var(--c) 60%, #241c4c); box-shadow: inset 0 0 0 2px #fff, 0 0 12px color-mix(in srgb, var(--c) 80%, transparent); }
.chip.cd { opacity: .4; pointer-events: none; }
.chip.ult { background: linear-gradient(90deg, #ff5bd1, #6a5bff, #3fe0ff); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; box-shadow: inset 0 0 0 2px #fff; }
.chip.ult.cd { animation: none; background: #2a2150; }
.chip .cdn { position: absolute; top: -5px; right: -3px; background: #000; border-radius: 6px; font-size: 10px; padding: 1px 4px; }
@keyframes shimmer { to { background-position: -200% 0; } }
.cmd .foot { display: flex; gap: 8px; padding: 8px 10px max(10px, env(safe-area-inset-bottom)); align-items: center; }
.cmd .hint { font-size: 12px; color: var(--dim); padding: 0 12px 4px; min-height: 18px; }
.toggle.on { background: linear-gradient(180deg, #84f08f, #2fbf55); color: #06300f; }

/* modal overlay */
.modal { position: absolute; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; background: rgba(6,3,20,.72); padding: 12px; }
.modal.on { display: flex; }
.modal .box { width: min(760px, 100%); max-height: 100%; display: flex; flex-direction: column; padding: 16px; }
.modal .box h2 { font-size: 24px; text-align: center; }
.modal .box .body { overflow-y: auto; margin-top: 10px; }
.modal .box .acts { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.list { display: flex; flex-direction: column; gap: 8px; }
.li { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,.06); }
.li img.ic { width: 48px; height: 48px; flex: 0 0 auto; }
.li .t { font-family: Fredoka, Nunito, system-ui, sans-serif; font-size: 16px; }
.li.click { cursor: pointer; } .li.click:hover { background: rgba(255,255,255,.12); }
.li.leg { background: linear-gradient(90deg, rgba(255,201,60,.22), rgba(255,255,255,.04)); box-shadow: inset 0 0 0 1px #ffc93c88; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.shopitem { padding: 10px; border-radius: 14px; background: rgba(255,255,255,.06); text-align: center; cursor: pointer; position: relative; }
.shopitem img { width: 64px; height: 64px; margin: 0 auto; object-fit: contain; }
.shopitem img.mon { width: 90px; height: 90px; }
.shopitem .pr { margin-top: 4px; font-weight: 800; color: var(--gold); }
.shopitem.sold { opacity: .3; pointer-events: none; }
.shopitem.poor .pr { color: var(--bad); }
.xprow { display: flex; gap: 10px; align-items: center; padding: 6px 8px; }
.xprow img { width: 52px; height: 52px; object-fit: contain; }
.lvup { color: var(--gold); font-family: Fredoka, Nunito, system-ui, sans-serif; animation: pop2 .6s ease-out; }
@keyframes pop2 { from { transform: scale(1.8); } }
.detail { display: grid; grid-template-columns: 220px 1fr; gap: 14px; }
@media (max-width: 620px) { .detail { grid-template-columns: 1fr; } }
.detail .big { display: grid; place-items: center; min-height: 180px; border-radius: 16px; background: radial-gradient(closest-side, color-mix(in srgb, var(--c) 40%, transparent), transparent); }
.detail .big img { max-width: 100%; max-height: 220px; filter: drop-shadow(0 10px 12px rgba(0,0,0,.5)); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; }
.stats div { background: rgba(0,0,0,.25); border-radius: 10px; padding: 6px; text-align: center; font-size: 12px; }
.stats b { display: block; font-family: Fredoka, Nunito, system-ui, sans-serif; font-size: 18px; }
.skl { padding: 6px 10px; border-radius: 10px; margin-bottom: 5px; background: color-mix(in srgb, var(--c) 16%, transparent); box-shadow: inset 3px 0 0 var(--c); }
.skl .t { font-family: Fredoka, Nunito, system-ui, sans-serif; } .skl.locked { opacity: .45; }
.evo-stage { position: relative; height: 260px; display: grid; place-items: center; }
.evo-stage img { position: absolute; max-height: 240px; max-width: 80%; }
.evo-stage .glow { position: absolute; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, #fff, #ffe48a66 40%, transparent 70%); animation: glow 1.4s ease-in-out infinite; }
@keyframes glow { 50% { transform: scale(1.15); opacity: .7; } }
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.dex div { text-align: center; padding: 6px; border-radius: 12px; background: rgba(255,255,255,.05); font-size: 12px; }
.dex img { height: 70px; margin: 0 auto; object-fit: contain; max-width: 90px; }
.dex .unseen img { filter: brightness(0) opacity(.5); }
.toast { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); z-index: 200; padding: 10px 18px; border-radius: 14px; background: #000c; font-family: Fredoka, Nunito, system-ui, sans-serif; display: none; text-align: center; max-width: 90%; }
.toast.on { display: block; animation: banner 2.4s ease-out forwards; }
.how p { margin: 0 0 10px; }
.how b { color: var(--gold); }
</style>
</head>
<body>
<div id="app">
  <section class="screen" id="title"><div class="bgimg" style="background-image:url(img/bg_title.webp)"></div>
    <div class="layer" style="margin:auto;width:100%;padding:12px">
      <div class="logo">Glimmerdeep</div>
      <div class="sub">Tame. Evolve. Delve.</div>
      <div class="title-mons"><img src="img/cr_bubb2.webp" alt=""><img src="img/cr_cind3.webp" alt=""><img src="img/cr_sprt2.webp" alt=""></div>
      <div class="menu" id="titleMenu"></div>
    </div>
  </section>
  <section class="screen" id="pick"><div class="bgimg" style="background-image:url(img/bg_camp.webp)"></div>
    <div class="layer scroll" style="flex:1;padding:14px 4px">
      <h2 style="text-align:center;font-size:28px">Choose your partner</h2>
      <p class="muted" style="text-align:center;margin:4px 12px">A second companion of a different element will tag along.</p>
      <div class="cards" id="pickCards"></div>
      <div class="row center wrap" id="pickDepth" style="margin:4px 0 14px"></div>
      <div class="row center"><button class="btn ghost sm" data-go="title">Back</button></div>
    </div>
  </section>
  <section class="screen" id="map"><div class="bgimg" id="mapBg"></div>
    <div class="topbar layer" id="mapTop"></div>
    <div class="panel hazard layer" id="mapHaz"></div>
    <div class="mapwrap layer" id="mapWrap"><div class="mapinner" id="mapInner"></div></div>
    <div class="partybar layer" id="mapParty"></div>
  </section>
  <section class="screen" id="battle">
    <div class="arena" id="arena"><div class="dim"></div></div>
    <div class="cmd">
      <div class="hint" id="cmdHint"></div>
      <div class="rows" id="cmdRows"></div>
      <div class="foot" id="cmdFoot"></div>
    </div>
  </section>
  <section class="screen" id="camp"><div class="bgimg" style="background-image:url(img/bg_camp.webp)"></div>
    <div class="topbar layer" id="campTop"></div>
    <div class="layer scroll" style="flex:1;padding:10px 12px" id="campBody"></div>
  </section>
  <div class="modal" id="modal"><div class="panel box" id="modalBox"></div></div>
  <div class="toast" id="toast"></div>
</div>
<script src="data.js"></script>
<script src="battle.js"></script>
<script src="run.js"></script>
<script src="game.js"></script>
</body>
</html>
