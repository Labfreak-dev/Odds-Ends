<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gearbound</title>
<meta name="theme-color" content="#120e22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120e22;--panel:#251d40;--line:#4d3d80;--line2:#6a55a8;
  --ink:#f2ecff;--dim:#a99cc9;--gold:#f6c84b;--gem:#5fd0ff;--nrg:#7be04f;--red:#ff4a4a;--good:#6be08a;
  --nav:76px;--cell:46px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07050f;color:var(--ink);font-family:'Jersey 10',ui-monospace,monospace;overflow:hidden;user-select:none;-webkit-user-select:none;font-size:19px;letter-spacing:.3px}
button{font:inherit;color:inherit;cursor:pointer}
img{-webkit-user-drag:none;user-select:none}
#app{position:relative;margin:0 auto;max-width:480px;height:100%;background:var(--bg);overflow:hidden}
.screen{position:absolute;inset:0 0 var(--nav) 0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding:0 12px 16px}
.pill{display:inline-flex;align-items:center;gap:5px;background:#0d0a1a;border:2px solid var(--line);border-radius:8px;padding:1px 9px;font-size:21px;line-height:1.15;white-space:nowrap}
.pill img{width:22px;height:22px;object-fit:contain}
.dot{position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;background:var(--red);border:2px solid #3a0a0a;display:none;box-shadow:0 0 6px #f00}
.dot.on{display:block}
/* painted kit (Thankless UI, nine-sliced) */
.btn{border:13px solid transparent;border-width:13px 12px 14px 12px;border-image:url(../thankless/ui/ui_btn.webp) 91 64 83 64 / 13px 12px 14px 12px stretch;background:linear-gradient(#4a3a7a,#2a2150);background-clip:padding-box;padding:0 8px;font-size:21px;line-height:1.2;filter:drop-shadow(0 3px 3px #000a);color:#f3ecff;text-shadow:0 2px 0 #000}
.btn:active{transform:translateY(2px)}
.btn.gold{border-width:14px 13px 16px 13px;border-image:url(../thankless/ui/ui_btn_on.webp) 89 70 120 69 / 14px 13px 16px 13px stretch;background:linear-gradient(#ffe08a,#e0a024);background-clip:padding-box;color:#2a1600;text-shadow:0 1px 0 #fff6}
.btn.red{background:linear-gradient(#ff8a7a,#b8322a);background-clip:padding-box}
.btn[disabled]{filter:grayscale(.9) brightness(.55);pointer-events:none}
.frame{border:18px solid transparent;border-width:18px 16px 18px 16px;border-image:url(../thankless/ui/ui_frame.webp) 88 70 88 68 / 18px 16px 18px 16px stretch;background:linear-gradient(#2c2250,#1a1434);background-clip:padding-box}
.ribbon{display:inline-block;border:12px solid transparent;border-width:12px 30px 12px 30px;border-image:url(../thankless/ui/ui_ribbon.webp) 64 137 59 137 / 12px 30px 12px 30px stretch;background:#c9ad74;background-clip:padding-box;color:#2a1600;padding:0 6px;line-height:1.05;font-size:22px;text-shadow:0 1px 0 #fff6}
.ttl{font-size:28px;text-align:center;margin:12px 0 8px;text-shadow:0 2px 0 #000}
.sub{color:var(--dim);font-size:17px;line-height:1.15}
.card{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.rt0{color:#c8c8d8}.rt1{color:#4aa8ff}.rt2{color:#c070ff}.rt3{color:#ffb22e}

/* ---------- top bar (home) ---------- */
#top{display:flex;align-items:flex-start;gap:8px;padding:10px 10px 6px;position:relative;z-index:3}
#ava{width:64px;height:64px;border:3px solid #8a7cc0;border-radius:6px;background:#0d0a1a center/cover no-repeat;flex:none;box-shadow:0 0 0 2px #000}
#who{flex:1;min-width:0}
#who .nm{font-size:26px;text-shadow:0 2px 0 #000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pow{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(#5b3aa8,#3a2470);border:2px solid #9b7dff;border-radius:16px;padding:0 10px 0 3px;font-size:22px;margin-top:2px;box-shadow:0 2px 0 #000}
.pow i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#1a1033;border:2px solid #c9b2ff;font-size:13px}
.pow.foe{background:linear-gradient(#a83a5a,#701e34);border-color:#ff8aa8}
#cur{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#cur .row{display:flex;gap:6px;align-items:center}
#nrgT{font-size:15px;color:var(--dim)}
.nrg b{color:var(--nrg)}.gem b{color:var(--gem)}.gld b{color:var(--gold)}

/* ---------- home ---------- */
#homeBg{position:absolute;inset:0;background:#141026 center/cover no-repeat;filter:saturate(.8) brightness(.55)}
#homeBg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 30%,#0b0818 85%),linear-gradient(#0b0818cc,#0000 20%,#0000 60%,#0b0818 92%)}
#homeIn{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;min-height:0}
.best{margin-top:2px;background:linear-gradient(90deg,#0000,#3a2a6a 20%,#3a2a6a 80%,#0000);padding:1px 34px;font-size:22px}
.best b{font-size:26px}
.chap{display:flex;align-items:center;gap:8px;margin-top:4px}
.chap .n{display:grid;place-items:center;min-width:40px;height:42px;padding:0 6px;background:#d8d0ff;color:#241a4a;border:3px solid #6b56b8;border-radius:6px;font-size:32px;box-shadow:0 3px 0 #000}
.chap .t{font-size:34px;text-shadow:0 3px 0 #000,0 0 12px #000;max-width:280px;line-height:.95;text-align:left}
.chap .arr{background:none;border:none;font-size:26px;padding:4px;color:#cfc3ff;text-shadow:0 2px 0 #000}
.chap .arr[disabled]{opacity:.2}
#stage{position:relative;flex:1;width:100%;min-height:170px}
#stageCv{position:absolute;inset:0;width:100%;height:100%}
.side{position:absolute;top:8px;display:flex;flex-direction:column;gap:12px;z-index:2}
.side.l{left:8px}.side.r{right:8px}
.sbtn{position:relative;width:74px;background:#0000;border:none;padding:0;text-align:center;font-size:17px;text-shadow:0 2px 0 #000,0 0 4px #000;line-height:1}
.sbtn img{display:block;width:54px;height:54px;object-fit:contain;margin:0 auto 2px;filter:drop-shadow(0 2px 0 #000)}
.duo{display:flex;gap:16px;justify-content:center;align-items:flex-end;padding:2px 18px 6px;border-bottom:3px solid #4d3d80;background:linear-gradient(#0000,#251d4088)}
.duo .sbtn{width:auto;min-width:104px;font-size:18px;color:#cfc3ff}
.bigStart{position:relative;margin:12px auto 8px;width:250px;height:84px;border:none;background:none;padding:0}
.bigStart .p{position:absolute;inset:0;transform:skewX(-12deg);background:linear-gradient(#3b2a1a,#22160c);border:3px solid #6a4ad0;box-shadow:0 0 0 3px #1a1230,0 5px 0 #000;border-radius:4px}
.bigStart .p::after{content:'';position:absolute;inset:6px;border:3px solid #d49a2a;border-radius:3px}
.bigStart .t{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;font-size:44px;line-height:.9;letter-spacing:1px;text-shadow:0 3px 0 #000}
.bigStart .t small{font-size:26px;color:#fff}
.bigStart .t small b{color:var(--nrg)}
.bigStart:active .p{transform:skewX(-12deg) translateY(3px)}
.bigStart.dim .p{filter:grayscale(.7) brightness(.7)}
#ticker{margin:0 10px 8px;align-self:stretch;display:flex;align-items:center;gap:8px;background:#2a2150cc;border:2px solid var(--line);border-radius:8px;padding:3px 8px;font-size:18px;color:#c6b8ff;overflow:hidden;white-space:nowrap}
#ticker span{overflow:hidden;text-overflow:ellipsis}

/* ---------- bottom nav ---------- */
#nav{position:absolute;left:0;right:0;bottom:0;height:var(--nav);display:flex;background:#160f2a;border-top:3px solid #3a2c66;z-index:5}
#nav button{position:relative;flex:1;background:linear-gradient(#2a2048,#1a1330);border:none;border-right:2px solid #0d0919;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;color:#a99cc9;padding:0}
#nav button img{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 2px 0 #000)}
#nav button.on{flex:1.45;background:linear-gradient(#5a3ca8,#2f1f62);color:#fff;font-size:20px}
#nav button.on img{width:60px;height:60px;margin-top:-24px}
#nav button.lock img{filter:grayscale(1) brightness(.45)}
#nav button.lock::after{content:'🔒';position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:18px}
#nav .dot{top:6px;right:10px}

/* ---------- backpack grid (run, battle) ---------- */
.grid{position:relative}
.cell{position:absolute;width:var(--cell);height:var(--cell);padding:2px}
.cell::before{content:'';position:absolute;inset:2px;border-radius:5px;background:linear-gradient(#3a2e60,#2a2148);box-shadow:inset 0 2px 0 #4a3c78,inset 0 -2px 0 #1a1430}
.cell.ok::before{background:#2f7a3a;box-shadow:inset 0 0 0 2px #7be04f}
.cell.bad::before{background:#7a2a2a;box-shadow:inset 0 0 0 2px #ff6a6a}
.cell.merge::before{background:#7a5a18;box-shadow:inset 0 0 0 2px #ffd34a}
.cell.st::before{background:linear-gradient(#2a2238,#1e1830);box-shadow:inset 0 0 0 1px #3a2e54}
.it{position:absolute;touch-action:none}
.it .tc{position:absolute;width:var(--cell);height:var(--cell)}
.it .tc::before{content:'';position:absolute;inset:3px;border-radius:5px;background:var(--tbg);box-shadow:inset 0 0 0 2px var(--tc),0 0 8px var(--tg)}
.it .ic{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.it .ic img{max-width:94%;max-height:94%;object-fit:contain;filter:drop-shadow(0 3px 2px #000)}
.it .stars{position:absolute;left:4px;bottom:1px;font-size:13px;color:var(--tc);text-shadow:0 1px 0 #000,0 0 3px #000;pointer-events:none;letter-spacing:-1px}
.it .mg{position:absolute;right:4px;top:2px;font-size:15px;pointer-events:none;animation:bob 1s ease-in-out infinite}
.it.inactive{opacity:.6}
.it .cdv{position:absolute;inset:3px;border-radius:5px;pointer-events:none;background:conic-gradient(#0000 calc(var(--p,0)*1turn),#000a 0)}
.it.fire .ic img{animation:fire .25s}
@keyframes fire{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-8deg);filter:drop-shadow(0 0 8px #fff)}100%{transform:none}}
@keyframes bob{50%{transform:translateY(-3px)}}
.t0{--tc:#a8a8b8;--tbg:#3a3a4a99;--tg:#0000}
.t1{--tc:#4aa8ff;--tbg:#1e3a6a99;--tg:#4aa8ff55}
.t2{--tc:#c070ff;--tbg:#4a1e6a99;--tg:#c070ff66}
.t3{--tc:#ffb22e;--tbg:#6a4a1299;--tg:#ffb22e88}
.adjStar{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;font-size:22px;line-height:24px;text-align:center;color:#ffe066;text-shadow:0 0 6px #ff0,0 1px 0 #000;pointer-events:none;z-index:5;animation:bob 1s ease-in-out infinite}
#drag{position:absolute;z-index:50;pointer-events:none;opacity:.92;filter:drop-shadow(0 10px 10px #000);display:none}

/* ---------- run: route, backpack, merchant ---------- */
#run{position:absolute;inset:0;z-index:15;display:none;flex-direction:column;background:#0e0a1c;touch-action:none}
#run.on{display:flex}
#runTop{position:relative;height:clamp(130px,24vh,200px);flex:none;overflow:hidden}
#runCv{position:absolute;inset:0;width:100%;height:100%}
#runHud{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;padding-top:4px}
#runHud .best{font-size:20px}
#runHud .chap .t{font-size:26px}
#runHud .chap .n{font-size:24px;height:32px;min-width:30px}
#rLives{position:absolute;left:8px;top:6px;font-size:22px;text-shadow:0 2px 0 #000;pointer-events:none;letter-spacing:2px}
#rGoldP{position:absolute;right:8px;top:6px;pointer-events:none}
#pPowB{position:absolute;left:10px;bottom:6px}#ePowB{position:absolute;right:10px;bottom:6px}
#packWrap{flex:none;display:flex;justify-content:center;padding:20px 6px 0}
#packBox{position:relative;padding:4px}
#packName{position:absolute;left:50%;top:-34px;transform:translateX(-50%);z-index:3;white-space:nowrap;font-size:18px}
#stashRow{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:2px}
#stashRow .lbl{font-size:14px;color:var(--dim);writing-mode:vertical-rl;transform:rotate(180deg)}
#shopBox{flex:none;margin:6px 8px 0;padding:6px 8px 8px;position:relative;background:linear-gradient(#3a2618,#24160c);border:3px solid #6a4a2a;border-radius:10px;box-shadow:inset 0 3px 0 #8a6a3a,0 4px 0 #000}
#shopBox.sell{box-shadow:inset 0 0 0 3px #ffd34a,0 0 18px #ffd34a}
#shopHead{display:flex;align-items:center;gap:8px;margin-bottom:2px}
#shopHead .t{flex:1;font-size:21px;color:#ffd9a0;text-shadow:0 2px 0 #000}
#shopHead .btn{font-size:18px}
#mShop{display:flex;gap:6px;justify-content:space-between}
.sc{position:relative;flex:1;min-width:0;height:96px;border-radius:8px;background:linear-gradient(#2a1d12,#1a1008);border:2px solid #5a3e22;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:2px;touch-action:none}
.sc img{flex:1;min-height:0;max-width:100%;object-fit:contain;filter:drop-shadow(0 3px 2px #000);pointer-events:none}
.sc .pr{font-size:19px;color:var(--gold);text-shadow:0 1px 0 #000;line-height:1}
.sc .pr.no{color:#ff7a7a}
.sc .nm{font-size:13px;color:#e8d8c0;white-space:nowrap;overflow:hidden;max-width:100%;line-height:1}
.sc.sold{opacity:.2;pointer-events:none}
.sc.t1{border-color:#4aa8ff;box-shadow:0 0 8px #4aa8ff66}.sc.t2{border-color:#c070ff;box-shadow:0 0 8px #c070ff66}.sc.t3{border-color:#ffb22e;box-shadow:0 0 10px #ffb22e88}
.sc .lk{position:absolute;top:2px;right:4px;font-size:14px}
.sc .mgh{position:absolute;top:2px;left:4px;font-size:15px;animation:bob 1s infinite}
#runBar{flex:none;display:flex;gap:12px;align-items:center;justify-content:center;padding:6px 10px 10px;margin-top:auto}
#runBar .back{font-size:28px;padding:0 14px}
.fight{position:relative;width:230px;height:68px;border:none;background:none;padding:0}
.fight .p{position:absolute;inset:0;transform:skewX(-12deg);background:linear-gradient(#7a1e1e,#3a0c0c);border:3px solid #ff8a5a;box-shadow:0 0 0 3px #1a0808,0 5px 0 #000;border-radius:4px}
.fight .p::after{content:'';position:absolute;inset:5px;border:2px solid #ffcf6a;border-radius:3px}
.fight .t{position:relative;font-size:40px;letter-spacing:1px;text-shadow:0 3px 0 #000}
.fight:active .p{transform:skewX(-12deg) translateY(3px)}

/* ---------- battle ---------- */
#battle{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;background:#000}
#battle.on{display:flex}
#bScene{position:relative;flex:1;min-height:0}
#bcv{position:absolute;inset:0;width:100%;height:100%;display:block}
#bTop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:8px}
#bTop .t{flex:1;font-size:24px;text-shadow:0 2px 0 #000}
.bctl{background:#0d0a1acc;border:2px solid var(--line2);border-radius:8px;padding:2px 10px;font-size:20px}
#eMoves{position:absolute;right:8px;top:48px;display:flex;gap:6px}
.mv{position:relative;width:46px;height:46px;border-radius:8px;background:#2a0d18cc;border:2px solid #a83a5a;overflow:hidden}
.mv img{width:100%;height:100%;object-fit:contain}
.mv .cdv{position:absolute;inset:0;background:conic-gradient(#0000 calc(var(--p,0)*1turn),#000b 0)}
.mv.fire{animation:fire .25s}
#bmsg{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:52px;text-shadow:0 3px 0 #000,0 0 18px #000;pointer-events:none;opacity:0;transition:opacity .3s}
#bmsg.on{opacity:1}
#bBag{flex:none;display:flex;justify-content:center;padding:8px 6px 12px;background:linear-gradient(#1a1430,#0e0a1c);border-top:3px solid #4d3d80}

/* ---------- modal / toast ---------- */
#modal{position:absolute;inset:0;background:#05030cd0;display:none;align-items:center;justify-content:center;z-index:60;padding:14px}
#modal.on{display:flex}
#mbox{width:100%;max-width:400px;max-height:92%;overflow:auto;padding:6px 10px 10px;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.mrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.kv{display:flex;justify-content:space-between;align-items:center;font-size:19px;padding:2px 0;border-bottom:1px dashed #3d3166}
.rw{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.tip{display:flex;gap:12px;align-items:center}
.tip .ib{width:84px;height:84px;flex:none;border-radius:10px;display:grid;place-items:center;background:radial-gradient(#3a2e5c,#1a1430);border:3px solid var(--tc)}
.tip .ib img{max-width:76px;max-height:76px;object-fit:contain}
.tip .nm{font-size:28px;line-height:1}
.eff{font-size:19px;line-height:1.2;margin-top:8px}
.eff div{padding:2px 0}
.tag{display:inline-block;font-size:15px;background:#0d0a1a;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin:2px 2px 0 0;color:var(--dim)}
#toast{position:absolute;left:50%;top:16%;transform:translateX(-50%);z-index:70;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:#1a1430ee;border:2px solid var(--line2);border-radius:10px;padding:4px 14px;font-size:21px;animation:pop .2s;white-space:nowrap}
.li{display:flex;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0}
.li img{width:56px;height:56px;object-fit:contain;flex:none}
.li .grow{flex:1;min-width:0}
.li .nm{font-size:22px}
.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hcard{position:relative;background:var(--panel);border:3px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center;font-size:16px}
.hcard img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#0d0a1a}
.hcard.on{border-color:var(--gold);box-shadow:0 0 12px #f6c84b66}
.hcard.lock img{filter:grayscale(1) brightness(.35)}
.hcard .nm{font-size:21px}
.arm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ac{position:relative;aspect-ratio:1;border-radius:10px;background:radial-gradient(#3a2e5c,#1a1430);border:2px solid var(--line);padding:0;overflow:hidden}
.ac img{position:absolute;left:8%;top:8%;width:84%;height:84%;object-fit:contain;filter:drop-shadow(0 2px 1px #000)}
.ac.lock img{filter:grayscale(1) brightness(.3)}
.ac .lv{position:absolute;left:4px;bottom:0;font-size:15px;color:var(--gold);text-shadow:0 1px 0 #000}
.ac .lk{position:absolute;right:4px;top:2px;font-size:14px}
.chestAnim{width:130px;height:130px;object-fit:contain;display:block;margin:6px auto;animation:shake .5s ease-in-out}
@keyframes shake{0%,100%{transform:none}20%{transform:rotate(-8deg) scale(1.05)}40%{transform:rotate(8deg) scale(1.1)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}
</style>
</head>
<body>
<div id="app">

  <!-- ===== ADVENTURE ===== -->
  <section class="screen on" id="home">
    <div id="homeBg"></div>
    <div id="top">
      <div id="ava"></div>
      <div id="who"><div class="nm" id="pName">Hero</div><div class="pow"><i>⚔</i><span id="pPow">0</span></div></div>
      <div id="cur">
        <div class="row"><span class="pill nrg">⚡<b id="nrg">35/35</b></span><span class="pill gem"><img data-art="ui_souls" alt=""><b id="gems">0</b></span></div>
        <div class="row"><span id="nrgT"></span><span class="pill gld"><img data-art="ui_coin" alt=""><b id="gold">0</b></span></div>
      </div>
    </div>
    <div id="homeIn">
      <div class="best">Best Round <b id="bestR">0</b>/12</div>
      <div class="chap"><button class="arr" id="chPrev">◀</button><span class="n" id="chN">1</span><span class="t" id="chT">—</span><button class="arr" id="chNext">▶</button></div>
      <div id="stage">
        <canvas id="stageCv"></canvas>
        <div class="side l">
          <button class="sbtn" id="bDaily"><img data-art="ui_daily" alt="">DAILY<span class="dot" id="dDaily"></span></button>
          <button class="sbtn" id="bBoost"><img data-art="ui_fast" alt="">REFILL</button>
        </div>
        <div class="side r">
          <button class="sbtn" id="bMenu"><img data-art="ui_settings" alt="">MENU</button>
          <button class="sbtn" id="bHelp"><img data-art="ui_contracts" alt="">GUIDE</button>
        </div>

/* ---------------- ui helpers ---------------- */
function toast(t,ms){if(SIM)return;const d=document.createElement('div');d.innerHTML=t;$('toast').appendChild(d);setTimeout(()=>d.remove(),ms||1800);}

function heroDef(id){return HEROES.find(h=>h.id===(id||S.hero));}

/* =====================================================================
   ITEM GEOMETRY
   ===================================================================== */
function rotCells(cells,r){let c=cells.map(p=>p.slice());for(let i=0;i<r;i++){const h=Math.max(...c.map(p=>p[1]))+1;c=c.map(([x,y])=>[h-1-y,x]);}return c;}
function itemCells(it,x,y,r){x=x==null?it.x:x;y=y==null?it.y:y;r=r==null?it.r:r;return rotCells(IT[it.id].cells,r).map(([a,b])=>[a+x,b+y]);}
function dims(id,r){const c=rotCells(IT[id].cells,r);return[Math.max(...c.map(p=>p[0]))+1,Math.max(...c.map(p=>p[1]))+1];}
function gridHas(g,x,y){if(g==='stash')return x>=0&&y>=0&&x<STASH.w&&y<STASH.h;return bagDef(run.bag).cells.has(x+','+y);}
function occupant(g,x,y,ignore){return run.items.find(o=>o!==ignore&&o.g===g&&itemCells(o).some(([a,b])=>a===x&&b===y));}
function canPlace(it,g,x,y,r,ignore){for(const[a,b]of itemCells(it,x,y,r)){if(!gridHas(g,a,b))return false;if(occupant(g,a,b,ignore))return false;}return true;}
function findSpot(it,g,pref){const b=bagDef(run.bag),gw=g==='stash'?STASH.w:b.w,gh=g==='stash'?STASH.h:b.h;
  for(const r of pref!=null?[pref,0,1,2,3]:[0,1,2,3])for(let y=0;y<gh;y++)for(let x=0;x<gw;x++)if(canPlace(it,g,x,y,r,it))return{x,y,r};return null;}
function neighbors(it){if(it.g!=='bag')return[];const set=new Set();
  for(const[x,y]of itemCells(it))for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const o=occupant('bag',x+dx,y+dy,it);if(o)set.add(o);}return[...set];}
function tagOk(d,to){return to==='any'||d.tags.includes(to);}
function adjUseful(a,d){if(a.dmg||a.dmgP||a.crit||a.ls)return!!d.d;if(a.burn||a.poison)return!!(d.d||d.burn||d.poison);if(a.spd)return!!(d.cd||d.blkCd);if(a.blkP)return!!(d.blk||d.blkCd);if(a.thorns)return d.tags.includes('armor');return true;}

/* =====================================================================
   STATS — what a packed item does once its neighbours are counted
   ===================================================================== */
function itemStats(it,ctx){const d=IT[it.id],h=heroDef(ctx&&ctx.hero),k=TIER[it.t].m*(1+.1*mastery(it.id)),s={};
  if(d.d){s.d=[d.d[0]*k,d.d[1]*k];s.cd=d.cd;}else if(d.cd){s.cd=d.cd;}
  for(const f of['burn','poison'])if(d[f])s[f]=Math.round(d[f]*(1+it.t*.6));
  if(d.crit)s.crit=d.crit;if(d.ls)s.ls=d.ls;if(d.multi)s.multi=d.multi;if(d.shred)s.shred=d.shred;
  if(d.blk)s.blk=d.blk*k;if(d.blkCd){s.cd=d.blkCd;s.blkN=d.blkN*k;}if(d.blkHit)s.blkHit=d.blkHit*k;
  if(d.thorns)s.thorns=d.thorns*(1+it.t);if(d.hp)s.hp=d.hp>0?d.hp*k:d.hp;if(d.regen)s.regen=d.regen*k;if(d.heal)s.heal=d.heal*k;
  if(d.once)s.once=d.once;if(d.cleanse)s.cleanse=1;if(d.rage)s.rage=d.rage*(1+it.t*.4);if(d.dodge)s.dodge=d.dodge*(1+it.t*.5);
  if(d.gold)s.gold=d.gold*(1+it.t);if(d.interest)s.interest=d.interest*(1+it.t);
  s.spd=0;s.dmg=0;s.dmgP=0;s.blkP=0;s.buffs=[];
  if(h){if(h.rangedSpd&&d.tags.includes('ranged'))s.spd+=h.rangedSpd;if(h.meleeDmg&&d.tags.includes('melee'))s.dmg+=h.meleeDmg;if(h.blkP&&d.tags.includes('armor'))s.blkP+=h.blkP;
    if(h.dot){if(s.burn)s.burn+=h.dot;if(s.poison)s.poison+=h.dot;}}
  if(d.d&&ctx&&ctx.edge)s.dmgP+=.04*ctx.edge;
  if(it.g==='bag')for(const n of neighbors(it)){const nd=IT[n.id];if(!nd.adj||!tagOk(d,nd.adj.to)||!adjUseful(nd.adj,d))continue;const a=nd.adj,m=TIER[n.t].m*(1+.1*mastery(n.id));s.buffs.push(nd.n);
    if(a.dmg)s.dmg+=a.dmg*m;if(a.dmgP)s.dmgP+=a.dmgP*(1+n.t*.3);if(a.crit)s.crit=(s.crit||0)+a.crit*(1+n.t*.5);
    if(a.burn)s.burn=(s.burn||0)+Math.round(a.burn*(1+n.t*.6));if(a.poison)s.poison=(s.poison||0)+Math.round(a.poison*(1+n.t*.6));
    if(a.ls)s.ls=(s.ls||0)+a.ls*(1+n.t*.5);if(a.spd)s.spd+=a.spd*(1+n.t*.5);if(a.blkP)s.blkP+=a.blkP*(1+n.t*.5);if(a.thorns)s.thorns=(s.thorns||0)+a.thorns*(1+n.t);}
  if(s.d)s.d=[(s.d[0]+s.dmg)*(1+s.dmgP),(s.d[1]+s.dmg)*(1+s.dmgP)];
  if(s.blk)s.blk*=1+s.blkP;if(s.blkN)s.blkN*=1+s.blkP;
  if(s.cd)s.cdE=s.cd/(1+s.spd);
  return s;}
function runCtx(){return{hero:run?run.hero:S.hero,edge:S.tal.edge};}
function heroHP(r){const h=heroDef(run?run.hero:S.hero);return 40+6*(r-1)+(h.hp||0)+5*S.tal.vigor;}
// a rough "power" of the packed bag, shown against the foe's on the route
function packPower(){const ctx=runCtx();let dps=0,def=S.tal.ward*3,sus=0,hp=heroHP(run.round);
  for(const it of run.items){if(it.g!=='bag')continue;const s=itemStats(it,ctx);
    if(s.d)dps+=(s.d[0]+s.d[1])/2*(s.multi||1)*(1+Math.min(1,s.crit||0))/s.cdE;
    if(s.burn&&s.cdE)dps+=s.burn*2/s.cdE;if(s.poison&&s.cdE)dps+=s.poison*3/s.cdE;
    if(s.blk)def+=s.blk;if(s.blkN)def+=s.blkN*6/s.cdE;if(s.hp)hp+=s.hp;if(s.regen)sus+=s.regen*12;if(s.heal)sus+=s.once?s.heal:s.heal*12/s.cdE;if(s.ls&&s.d)sus+=s.ls*(s.d[0]+s.d[1])/2*8/s.cdE;}
  return Math.round(dps*12+(hp+def+sus)*.9);}

/* =====================================================================
   ENEMIES
   ===================================================================== */
function chScale(c){return Math.pow(1.3,c-1);}
function roundScale(r){return 1+.26*(r-1);}
function foeFor(ch,round,seed){const cd=chapterDef(ch);let k,kind='mob';
  if(round===12){k=cd.boss;kind='boss';}else if(round===6){k=cd.elite;kind='elite';}else k=cd.mob[(seed+round*7)%cd.mob.length];
  const E=ENEMIES[k],sc=chScale(ch)*roundScale(round)*(kind==='elite'?1.3:1),hs=sc*(kind==='elite'?1.5:1);
  return{k,kind,n:E.n,hp:Math.round(E.hp*hs),blk:Math.round((E.blk||0)*sc),thorns:Math.round((E.thorns||0)*Math.sqrt(sc)),
    mv:E.mv.map(m=>{const o=Object.assign({},m);for(const f of['dmg','block','heal'])if(o[f])o[f]=Math.max(1,Math.round(o[f]*sc));for(const f of['burn','poison'])if(o[f])o[f]=Math.max(1,Math.round(o[f]*Math.sqrt(sc)));return o;})};}
function foePower(f){let dps=0,sus=0;for(const m of f.mv){if(m.dmg)dps+=m.dmg*(1+(m.crit||0))/m.cd;if(m.burn)dps+=m.burn*2/m.cd;if(m.poison)dps+=m.poison*3/m.cd;if(m.block)sus+=m.block*6/m.cd;if(m.heal)sus+=m.heal*8/m.cd;}
  for(const m of f.mv)if(m.rage)dps*=1+m.rage*.5;return Math.round(dps*12+(f.hp+f.blk+sus)*.9);}

/* =====================================================================
   RUN STATE
   ===================================================================== */
let run=null,uid=1;
function newRunState(ch){const h=heroDef();run={ch,round:1,lives:3,gold:Math.round(8*goldMul(ch))+S.tal.purse,hero:S.hero,bag:S.bag,items:[],shop:[],seed:ri(0,99),wins:0,losses:0,rolled:false};
  h.start.forEach(id=>{const it={u:uid++,id,t:0,g:'bag',x:0,y:0,r:0};const sp=findSpot(it,'bag');if(sp){Object.assign(it,sp);run.items.push(it);}});
  rollShop(true);return run;}
function shopPool(round){return ITEMS.filter(d=>S.items.includes(d.id)&&d.r<=round+1&&(!d.cls||d.cls===run.hero));}
function rollShop(fresh){const pool=shopPool(run.round),out=[];const keep=fresh?[]:run.shop.filter(s=>s&&s.lock&&!s.sold);
  for(let i=0;i<5;i++){if(keep[i]){out.push(keep[i]);continue;}
    // lean toward items you already own (merges) and toward this round's newest rarity band
    const w=pool.map(d=>(run.items.some(o=>o.id===d.id)?2.2:1)*(d.r>=run.round-2?1.4:1)*(d.tags.includes('weapon')?1.2:1));
    let t=w.reduce((a,b)=>a+b),r=Math.random()*t,j=0;for(;j<w.length-1;j++){r-=w[j];if(r<0)break;}
    const d=pool[j];let tier=0;if(run.round>=5&&Math.random()<.12+run.round*.02)tier=1;if(run.round>=9&&Math.random()<.1)tier=2;
    out.push({id:d.id,t:tier,price:price(d.id,tier),sold:false});}
  run.shop=out;}
function price(id,t){return IT[id].cost*Math.pow(2,t);}
function sellValue(it){const p=price(it.id,it.t);return IT[it.id].fullSell?p:Math.max(1,Math.floor(p/2));}
// deeper chapters pay more per round, so packs grow (and merge) to match the foes
function goldMul(ch){return 1+.45*(ch-1);}
function roundGold(){let g=(5+Math.min(run.round,8))*goldMul(run.ch)+(heroDef(run.hero).gold||0);
  for(const it of run.items)if(it.g==='bag'){const s=itemStats(it,runCtx());if(s.gold)g+=s.gold;if(s.interest)g+=Math.min(Math.floor(run.gold/5)*s.interest,4*s.interest);}return Math.round(g);}
function tryMerge(it,target){if(!target||target===it||target.id!==it.id||target.t!==it.t||it.t>=TIER.length-1)return false;
  run.items=run.items.filter(o=>o!==it);target.t++;sfx('level',.5);toast('⬆ <span class="rt'+target.t+'">'+TIER[target.t].n+' '+IT[target.id].n+'</span>');return true;}
function mergeCandidates(id,t){return t<TIER.length-1?run.items.filter(o=>o.id===id&&o.t===t):[];}

/* =====================================================================
   RUN SCREEN
   ===================================================================== */
let cellPx=46,stashPx=38;
function layoutCells(){const b=bagDef(run.bag),vw=Math.min(480,window.innerWidth),vh=window.innerHeight;
  // fit the bag across, and leave room in height for the route strip, stash, merchant and buttons
  const top=$('runTop').getBoundingClientRect().height||200,byW=(vw-56)/b.w,byH=(vh-top-76-140-84-40)/b.h;cellPx=Math.floor(clamp(Math.min(byW,byH),28,58));
  stashPx=Math.floor(Math.min(cellPx*.82,(vw-40)/STASH.w));
  document.documentElement.style.setProperty('--cell',cellPx+'px');}
function gridHtml(g,cs){let h='';const b=bagDef(run.bag),W=g==='stash'?STASH.w:b.w,H=g==='stash'?STASH.h:b.h;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(g==='stash'||b.cells.has(x+','+y))h+='<div class="cell'+(g==='stash'?' st':'')+'" data-g="'+g+'" data-x="'+x+'" data-y="'+y+'" style="left:'+x*cs+'px;top:'+y*cs+'px"></div>';
  return{h,w:W*cs,hh:H*cs};}
function itemHtml(it,cs,extra){const d=IT[it.id],[w,h]=dims(it.id,it.r);let t='';
  for(const[x,y]of itemCells(it,0,0))t+='<div class="tc" style="left:'+x*cs+'px;top:'+y*cs+'px"></div>';
  // the picture fills the footprint's box and turns with the item
  const rot=it.r%2?'width:'+h*cs+'px;height:'+w*cs+'px;left:'+((w-h)*cs/2)+'px;top:'+((h-w)*cs/2)+'px;transform:rotate('+it.r*90+'deg)':(it.r?'transform:rotate('+it.r*90+'deg)':'');
  return '<div class="it t'+it.t+(it.g==='stash'?' inactive':'')+'" data-u="'+it.u+'" style="left:'+it.x*cs+'px;top:'+it.y*cs+'px;width:'+w*cs+'px;height:'+h*cs+'px">'+t+
    '<div class="ic" style="'+rot+'"><img src="'+src(d.a)+'" alt=""></div><span class="stars">'+'★'.repeat(it.t+1)+'</span>'+(extra||'')+'</div>';}
function renderRun(){if(!run)return;layoutCells();const R=run,cs=cellPx,b=bagDef(R.bag);
  $('rRound').textContent=R.round;$('rChN').textContent=R.ch;$('rChT').textContent=chapterDef(R.ch).name;$('rGold').textContent=R.gold;
  $('rLives').textContent='❤'.repeat(R.lives)+'🖤'.repeat(3-R.lives);$('packName').textContent=b.n+' ×'+b.size;
  const bg=gridHtml('bag',cs);let h=bg.h;
  for(const it of R.items)if(it.g==='bag')h+=itemHtml(it,cs,mergeCandidates(it.id,it.t).length>1?'<span class="mg">⬆</span>':'');
  Object.assign($('bagG').style,{width:bg.w+'px',height:bg.hh+'px'});$('bagG').innerHTML=h;
  const sg=gridHtml('stash',stashPx);let sh=sg.h;for(const it of R.items)if(it.g==='stash')sh+=itemHtml(it,stashPx,mergeCandidates(it.id,it.t).length>1?'<span class="mg">⬆</span>':'');
  Object.assign($('stashG').style,{width:sg.w+'px',height:sg.hh+'px'});$('stashG').style.setProperty('--cell',stashPx+'px');$('stashG').innerHTML=sh;
  $('mShop').innerHTML=R.shop.map((s,i)=>{const d=IT[s.id],mg=mergeCandidates(s.id,s.t).length;
    return '<div class="sc t'+s.t+(s.sold?' sold':'')+'" data-s="'+i+'"><img src="'+src(d.a)+'" alt="">'+(s.lock?'<span class="lk">🔒</span>':'')+(mg?'<span class="mgh">⬆</span>':'')+'<span class="nm">'+d.n+'</span><span class="pr'+(R.gold<s.price?' no':'')+'">🪙'+s.price+'</span></div>';}).join('');
  const free=heroDef(R.hero).freeRoll&&!R.rolled;$('rerollC').textContent=free?'free':'1';$('reroll').disabled=!free&&R.gold<1;
  $('pPowR').textContent=fmt(packPower());$('ePowR').textContent=fmt(foePower(foeFor(R.ch,R.round,R.seed)));$('shopT').textContent='Merchant · round '+R.round;
  saveRun();}
function saveRun(){if(SIM)return;S.run=run&&!run.vault?JSON.parse(JSON.stringify(run)):S.run;save();}

/* ---------- drag & drop ---------- */
let drag=null;
function cellAt(px,py){// which grid cell is under the point: bag first, then stash
  for(const g of['bag','stash']){const el=$(g==='bag'?'bagG':'stashG'),r=el.getBoundingClientRect(),cs=g==='bag'?cellPx:stashPx;
    if(px>=r.left-cs*.5&&px<=r.right+cs*.5&&py>=r.top-cs*.5&&py<=r.bottom+cs*.5)return{g,fx:(px-r.left)/cs,fy:(py-r.top)/cs};}return null;}
function overShop(px,py){const r=$('shopBox').getBoundingClientRect();return px>=r.left&&px<=r.right&&py>=r.top&&py<=r.bottom;}
function ghost(){const g={u:-1,id:drag.it.id,t:drag.it.t,g:'bag',x:0,y:0,r:drag.r};$('drag').innerHTML=itemHtml(g,cellPx);const[w,h]=dims(drag.it.id,drag.r);drag.ox=w*cellPx/2;drag.oy=h*cellPx/2;}
function startDrag(e,it,shopI){drag={it,shopI,r:it.r||0,sx:e.clientX,sy:e.clientY,moved:false,pid:e.pointerId,touch:e.pointerType==='touch'};ghost();moveDrag(e);}
function rotateDrag(){if(!drag)return;drag.r=(drag.r+1)%4;ghost();moveDrag({clientX:drag.cx,clientY:drag.cy});}
function moveDrag(e){const runR=$('run').getBoundingClientRect(),el=$('drag');drag.cx=e.clientX;drag.cy=e.clientY;
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8)drag.moved=true;
  const lift=drag.touch?34:0;el.style.display=drag.moved?'block':'none';
  el.style.left=(e.clientX-runR.left-drag.ox)+'px';el.style.top=(e.clientY-runR.top-drag.oy-lift)+'px';
  drag.px=e.clientX;drag.py=e.clientY-lift;previewDrop();}
function dropTarget(){if(!drag||!drag.moved)return null;const c=cellAt(drag.px,drag.py);if(!c)return null;
  const[w,h]=dims(drag.it.id,drag.r),x=Math.round(c.fx-w/2),y=Math.round(c.fy-h/2);
  const probe={id:drag.it.id,t:drag.it.t,r:drag.r},ignore=drag.shopI==null?drag.it:null;
  const under=occupant(c.g,Math.floor(c.fx),Math.floor(c.fy),ignore);// drop on a twin = merge
  if(under&&under.id===drag.it.id&&under.t===drag.it.t&&under.t<TIER.length-1)return{g:c.g,merge:under};
  return{g:c.g,x,y,ok:canPlace(probe,c.g,x,y,drag.r,ignore),cells:itemCells(probe,x,y,drag.r)};}
function clearMarks(){document.querySelectorAll('.cell.ok,.cell.bad,.cell.merge').forEach(c=>c.classList.remove('ok','bad','merge'));document.querySelectorAll('.adjStar').forEach(e=>e.remove());}

  $('shopBox').classList.toggle('sell',!!selling);
  if(selling){$('shopT').textContent='Sell for 🪙'+sellValue(drag.it);return;}if(run)$('shopT').textContent='Merchant · round '+run.round;
  const t=dropTarget();if(!t)return;
  if(t.merge){for(const[x,y]of itemCells(t.merge))mark(t.g,x,y,'merge');return;}
  for(const[x,y]of t.cells)mark(t.g,x,y,t.ok?'ok':'bad');
  if(t.ok&&t.g==='bag')showAdj({id:drag.it.id,t:drag.it.t,g:'bag',x:t.x,y:t.y,r:drag.r},drag.shopI==null?drag.it:null);}

// stars over the neighbours this item would buff, or be buffed by
function showAdj(probe,ignore){const d=IT[probe.id],seen=new Set();
  for(const[x,y]of itemCells(probe))for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const o=occupant('bag',x+dx,y+dy,ignore);if(!o||seen.has(o))continue;
    const od=IT[o.id],gives=d.adj&&tagOk(od,d.adj.to)&&adjUseful(d.adj,od),gets=od.adj&&tagOk(d,od.adj.to)&&adjUseful(od.adj,d);
    if(gives||gets){seen.add(o);const oc=itemCells(o),cx=(Math.min(...oc.map(p=>p[0]))+Math.max(...oc.map(p=>p[0]))+1)/2,cy=(Math.min(...oc.map(p=>p[1]))+Math.max(...oc.map(p=>p[1]))+1)/2;
      const s=document.createElement('div');s.className='adjStar';s.textContent='★';s.style.left=cx*cellPx+'px';s.style.top=cy*cellPx+'px';$('bagG').appendChild(s);}}}

/* =====================================================================
   BATTLE ENGINE — pure, shared by the screen and the balance sim
   ===================================================================== */
function mkSide(){return{hp:0,max:0,blk:0,burn:0,poison:0,regen:0,rage:0,thorns:0,dodge:0,critX:2,dotT:0,poisT:0,items:[]};}
function battleState(R,foe){const ctx=runCtx(),h=heroDef(R.hero),P=mkSide(),E=mkSide();
  P.max=heroHP(R.round);P.blk=S.tal.ward*3;P.critX=h.critX||2;let crit=h.crit||0;
  for(const it of R.items){if(it.g!=='bag')continue;const s=itemStats(it,ctx);s.u=it.u;s.id=it.id;s.timer=s.cdE?s.cdE*rnd(.2,.4):0;s.used=false;
    if(s.hp)P.max+=s.hp;if(s.blk)P.blk+=s.blk;if(s.regen)P.regen+=s.regen;if(s.thorns)P.thorns+=s.thorns;if(s.dodge)P.dodge+=s.dodge;if(!s.d&&s.crit)crit+=s.crit;
    P.items.push(s);}
  P.items.forEach(s=>{if(s.d)s.crit=(s.crit||0)+crit;});
  P.max=Math.max(10,Math.round(P.max));P.hp=P.max;P.blk=Math.round(P.blk);
  E.max=E.hp=foe.hp;E.blk=foe.blk;E.thorns=foe.thorns;E.items=foe.mv.map(m=>Object.assign({},m,{timer:m.cd*rnd(.3,.55)}));
  return{P,E,t:0,foe,over:false,win:null,ev:[]};}
function sideOf(B,X){return X===B.P?'P':'E';}
function bStep(B,dt){if(B.over)return;B.t+=dt;const{P,E}=B;
  // fatigue: after 25s both sides wear down, so every fight ends
  if(B.t>25&&!B.vault){B.fatT=(B.fatT||0)+dt;if(B.fatT>=1){B.fatT-=1;const f=Math.ceil((B.t-25)/2);dmgRaw(B,P,f,'fat');dmgRaw(B,E,f,'fat');}}
  for(const X of[P,E]){X.dotT+=dt;if(X.dotT>=1){X.dotT-=1;if(X.burn>0){dmgRaw(B,X,X.burn,'burn',true);X.burn--;}if(X.regen>0)healS(B,X,X.regen);}
    X.poisT+=dt;if(X.poisT>=2){X.poisT-=2;if(X.poison>0)dmgRaw(B,X,X.poison,'poison');}}
  for(const s of P.items){
    if(s.once){if(s.used)continue;
      if((s.once==='low'&&P.hp<P.max*.5)||(s.once==='dot'&&P.burn+P.poison>=3)||(s.once==='t6'&&B.t>=6)){s.used=true;
        if(s.heal)healS(B,P,s.heal);if(s.cleanse){P.burn=0;P.poison=0;}if(s.rage){P.rage+=s.rage;B.ev.push({k:'rage',side:'P'});}B.ev.push({k:'use',side:'P',u:s.u,id:s.id});}continue;}
    if(!s.cdE)continue;s.timer+=dt;if(s.timer>=s.cdE){s.timer-=s.cdE;useItem(B,P,E,s);}}
  for(const m of E.items){m.timer+=dt;if(m.timer>=m.cd){m.timer-=m.cd;useItem(B,E,P,m);}}
  if(B.vault){if(B.t>=20||P.hp<=0){B.over=true;B.win=true;}return;}
  if(P.hp<=0||E.hp<=0){B.over=true;B.win=E.hp<=0&&(P.hp>0||P.hp>=E.hp);}}
function useItem(B,A,D,s){const side=sideOf(B,A),tags=s.id?IT[s.id].tags:[];B.ev.push({k:'use',side,u:s.u,n:s.n,id:s.id});
  const ranged=tags.includes('ranged')||tags.includes('bomb')||tags.includes('magic')||!!s.proj;
  if(s.d||s.dmg){for(let i=0;i<(s.multi||1);i++){let v=s.d?rnd(s.d[0],s.d[1]):s.dmg;v*=1+A.rage;let crit=false;if(Math.random()<(s.crit||0)){v*=A.critX;crit=true;}
      const dealt=hit(B,A,D,Math.round(v),{crit,shred:s.shred,ranged,bomb:tags.includes('bomb')});
      if(dealt!=null){if(s.ls)healS(B,A,dealt*s.ls);if(s.blkHit)A.blk+=Math.round(s.blkHit);if(s.burn)addDot(B,D,'burn',s.burn);if(s.poison)addDot(B,D,'poison',s.poison);}}}
  else{if(s.burn)addDot(B,D,'burn',s.burn);if(s.poison)addDot(B,D,'poison',s.poison);}
  if(s.blkN||s.block){const v=Math.round(s.blkN||s.block);A.blk+=v;B.ev.push({k:'blk',side,v});}
  if(s.heal&&!s.once)healS(B,A,s.heal);
  if(s.rage&&!s.once){A.rage+=s.rage;B.ev.push({k:'rage',side});}}
function addDot(B,D,k,n){D[k]+=n;B.ev.push({k,side:sideOf(B,D),v:n});}
function hit(B,A,D,v,o){const ds=sideOf(B,D);if(D.dodge&&Math.random()<D.dodge){B.ev.push({k:'dodge',side:ds});return null;}
  let rest=v;if(D.blk>0){const sh=1+(o.shred||0),soak=Math.min(D.blk,Math.round(rest*sh));D.blk-=soak;rest-=Math.round(soak/sh);B.ev.push({k:'blocked',side:ds,v:soak});}
  rest=Math.max(0,rest);D.hp-=rest;B.ev.push({k:'hit',side:ds,v:rest,crit:o.crit,bomb:o.bomb});
  if(D.thorns&&!o.ranged){A.hp-=D.thorns;B.ev.push({k:'thorns',side:sideOf(B,A),v:Math.round(D.thorns)});}
  return rest;}
function dmgRaw(B,X,v,kind,blockable){if(blockable&&X.blk>0){const t=Math.min(X.blk,v);X.blk-=t;v-=t;}X.hp-=v;if(v>0)B.ev.push({k:'dot',side:sideOf(B,X),v,kind});}
function healS(B,X,v){const b=X.hp;X.hp=Math.min(X.max,X.hp+v);const g=X.hp-b;if(g>=1)B.ev.push({k:'heal',side:sideOf(B,X),v:Math.round(g)});}

let battle=null,lastT=0;
function showBattle(B,foe,title){battle={B,foe,hero:run.hero,ch:run.ch,speed:S.speed||1,fx:[],nums:[],shake:0,pose:{P:0,E:0},hurt:{P:0,E:0},proj:[],endT:0,shown:false,hpShow:{P:B.P.hp,E:B.E.hp}};
  $('run').classList.remove('on');$('battle').classList.add('on');$('bSpeed').textContent='x'+battle.speed;$('bT').textContent=title;
  $('eMoves').innerHTML=foe.mv.map((m,i)=>'<div class="mv" data-m="'+i+'" title="'+esc(m.n)+'"><img src="'+src(m.a)+'"><div class="cdv"></div></div>').join('');
  // the packed bag below the fight, each item sweeping its cooldown
  const b=bagDef(run.bag),cs=Math.floor(Math.min(46,(Math.min(480,innerWidth)-24)/b.w,innerHeight*.3/b.h)),g=gridHtml('bag',cs);let h=g.h;
  for(const it of run.items)if(it.g==='bag')h+=itemHtml(it,cs,'<div class="cdv"></div>');
  const bb=$('bBagG');bb.style.setProperty('--cell',cs+'px');bb.style.width=g.w+'px';bb.style.height=g.hh+'px';bb.innerHTML=h;
  lastT=performance.now();requestAnimationFrame(bLoop);}
function startBattle(){const R=run,foe=foeFor(R.ch,R.round,R.seed);showBattle(battleState(R,foe),foe,'Round '+R.round+' · '+foe.n);
  if(foe.kind==='boss'){music('boss');sfx('boss');bmsg('BOSS');}else if(foe.kind==='elite'){sfx('elite');bmsg('ELITE');}else{sfx('door',.4);bmsg('FIGHT!');}}
function bmsg(t){const e=$('bmsg');e.textContent=t;e.classList.add('on');clearTimeout(bmsg.t);bmsg.t=setTimeout(()=>e.classList.remove('on'),1100);}
$('bSpeed').onclick=()=>{if(!battle)return;battle.speed=battle.speed===1?2:battle.speed===2?4:1;S.speed=battle.speed;save();$('bSpeed').textContent='x'+battle.speed;};
$('bSkip').onclick=()=>{if(!battle)return;const B=battle.B;let g=0;while(!B.over&&g++<20000)bStep(B,1/30);B.ev=[];};
function bLoop(ts){if(!battle)return;const bt=battle,B=bt.B,dt=Math.min(.05,(ts-lastT)/1000);lastT=ts;
  if(!B.over){for(let i=0;i<bt.speed;i++)bStep(B,dt);}else bt.endT+=dt;
  for(const e of B.ev)onEvent(e);B.ev=[];
  drawBattle(dt);
  for(const s of B.P.items){const el=document.querySelector('#bBagG .it[data-u="'+s.u+'"] .cdv');if(el)el.style.setProperty('--p',s.once?(s.used?0:1):s.cdE?clamp(s.timer/s.cdE,0,1):1);}
  B.E.items.forEach((m,i)=>{const el=document.querySelector('#eMoves [data-m="'+i+'"] .cdv');if(el)el.style.setProperty('--p',clamp(m.timer/m.cd,0,1));});
  if(B.over&&bt.endT>1.1&&!bt.shown){bt.shown=true;endBattle(B.win);}
  requestAnimationFrame(bLoop);}
function onEvent(e){const bt=battle;
  if(e.k==='use'){if(e.side==='P'){const el=document.querySelector('#bBagG .it[data-u="'+e.u+'"]');if(el){el.classList.remove('fire');void el.offsetWidth;el.classList.add('fire');}
      const d=e.id&&IT[e.id];if(d&&d.tags.includes('weapon')){bt.pose.P=.25;
        if(d.tags.includes('ranged')){bt.proj.push({side:'P',t:0,k:'arrow'});sfx('arrow',.35);}else if(d.tags.includes('bomb'))bt.proj.push({side:'P',t:0,k:'bomb'});
        else if(d.tags.includes('magic'))bt.proj.push({side:'P',t:0,k:'orb'});else sfx(pick(['swing','swing2','swing3']),.35);}
      else if(d&&d.tags.includes('potion'))sfx('drink',.4);}
    else{const i=bt.foe.mv.findIndex(m=>m.n===e.n),el=document.querySelector('#eMoves [data-m="'+i+'"]');if(el){el.classList.remove('fire');void el.offsetWidth;el.classList.add('fire');}
      const m=bt.foe.mv[i];if(m&&(m.dmg||m.burn||m.poison)){bt.pose.E=.3;if(m.proj)bt.proj.push({side:'E',t:0,k:'orb'});}}}
  else if(e.k==='hit'){bt.hurt[e.side]=.15;num(e.side,(e.crit?'💥':'')+e.v,e.crit?'#ffd34a':e.side==='P'?'#ff6a6a':'#fff',e.crit?1.4:1);
    fx(e.side,e.bomb?'fxa_bomb':e.crit?'fxa_slash':'fxa_hit',e.bomb?.6:e.crit?.8:.6);if(e.crit)bt.shake=7;sfx(e.bomb?'boom':e.crit?'impact':e.side==='P'?'hurt':'hit',.4);}
  else if(e.k==='blocked'){num(e.side,'🛡'+e.v,'#7fd0ff',.9);sfx('parry',.25);}
  else if(e.k==='blk'){num(e.side,'+'+e.v+'🛡','#7fd0ff',.9);fx(e.side,'fxa_block',.5);sfx('block',.3);}
  else if(e.k==='heal'){num(e.side,'+'+e.v,'#7be04f',1);if(e.v>=5)fx(e.side,'fxa_heal',.6);}
  else if(e.k==='dot'){num(e.side,(e.kind==='burn'?'🔥':e.kind==='poison'?'☠':'💀')+e.v,e.kind==='burn'?'#ff9a3a':e.kind==='poison'?'#9be05a':'#c9a2ff',.85);if(e.kind==='poison')fx(e.side,'fxa_curse',.4);}
  else if(e.k==='burn')sfx('fire',.25);
  else if(e.k==='dodge')num(e.side,'miss','#ddd',1);
  else if(e.k==='thorns')num(e.side,'🌵'+e.v,'#c9a2ff',.85);
  else if(e.k==='rage')num(e.side,'RAGE','#ff5a5a',1.1);}
function num(side,t,c,s){battle.nums.push({side,t,c,s,a:0,x:rnd(-24,24)});}
function fx(side,k,s){if(META[k])battle.fx.push({side,k,s,t:0});}
function closeBattle(){closeModal();battle=null;$('battle').classList.remove('on');if(run&&!run.vault)openRun();else{run=null;music('home');setTab(tab);}}
function endBattle(win){const R=run,foe=battle.foe;
  if(battle.B.vault){const dmg=Math.round(1e9-battle.B.E.hp),g=Math.round(dmg*.6);S.gold+=g;if(dmg>S.dunBest)S.dunBest=dmg;save();sfx('jackpot');
    modal('<div class="ttl" style="color:var(--gold)">Vault Closed</div><p class="sub" style="text-align:center">'+fmt(dmg)+' damage in 20 seconds</p><div class="rw"><span class="pill gld"><img data-art="ui_coin"><b>+'+fmt(g)+'</b></span></div><div class="mrow"><button class="btn gold" id="bOk">Continue</button></div>',b=>{b.querySelector('#bOk').onclick=closeBattle;});return;}
  if(win){R.wins++;S.wins++;sfx('win');}else{R.lives--;R.losses++;sfx('lose');}
  const cleared=win?R.round:R.round-1;if(cleared>(S.best[R.ch]||0))S.best[R.ch]=cleared;
  let h='';
  if(win&&R.round===12){const first=R.ch===S.ch,gems=40+(first?60:0),gold=60+R.ch*40;if(first){S.ch++;S.sel=S.ch;}
    const unl=Object.keys(UNLOCK_CH).filter(k=>UNLOCK_CH[k]===R.ch&&!S.items.includes(k));unl.forEach(k=>S.items.push(k));
    S.gold+=gold;S.gems+=gems;S.vaultBag={hero:R.hero,bag:R.bag,items:JSON.parse(JSON.stringify(R.items))};
    const nh=first&&HEROES.find(x=>x.un===R.ch);log('Chapter '+R.ch+' cleared!'+(nh?' '+nh.n+' unlocked.':''));
    h='<div class="ttl" style="color:var(--gold);font-size:42px">CHAPTER CLEAR</div><p class="sub" style="text-align:center">'+chapterDef(R.ch).name+' · '+R.losses+' lives lost</p>'+
      '<div class="rw"><span class="pill gld"><img data-art="ui_coin"><b>+'+gold+'</b></span><span class="pill gem"><img data-art="ui_souls"><b>+'+gems+'</b></span></div>'+
      (first?'<p style="text-align:center;color:var(--good)">Chapter '+(R.ch+1)+' is open!'+(nh?'<br>New hero: '+nh.n:'')+'</p>':'')+
      (unl.length?'<p style="text-align:center">New items join the merchant:</p><div class="rw">'+unl.map(k=>'<span class="pill"><img src="'+src(IT[k].a)+'">'+IT[k].n+'</span>').join('')+'</div>':'');
    endRun();}
  else if(!win&&R.lives<=0){const g=10+cleared*(6+R.ch*3);S.gold+=g;S.gems+=cleared;log('Fell in Chapter '+R.ch+' at round '+R.round);
    h='<div class="ttl" style="color:#ff7a7a;font-size:42px">DEFEAT</div><p class="sub" style="text-align:center">Out of lives at round '+R.round+'/12.</p><div class="rw"><span class="pill gld"><img data-art="ui_coin"><b>+'+g+'</b></span><span class="pill gem"><img data-art="ui_souls"><b>+'+cleared+'</b></span></div><p class="sub" style="text-align:center">Spend gold in the Armory to master items, and in Heroes on talents.</p>';
    endRun();}
  else{const gold=roundGold(),prev=R.round;if(win)R.round++;R.gold+=gold;R.rolled=false;rollShop(false);
    h='<div class="ttl" style="font-size:40px;color:'+(win?'var(--gold)':'#ff7a7a')+'">'+(win?'VICTORY':'DEFEAT')+'</div><p class="sub" style="text-align:center">'+(win?foe.n+' falls. On to round '+R.round+'.':'You lost a life. Round '+prev+' again, with a new shop.')+'</p>'+
      '<div class="rw"><span class="pill">'+'❤'.repeat(R.lives)+'🖤'.repeat(3-R.lives)+'</span><span class="pill gld"><img data-art="ui_coin"><b>+'+gold+'</b></span></div>';
    saveRun();}
  save();modal(h+'<div class="mrow"><button class="btn gold" id="bOk">Continue</button></div>',b=>{b.querySelector('#bOk').onclick=closeBattle;});}
function endRun(){run=null;S.run=null;save();}

/* ---------- battle drawing ---------- */
function fitCv(cv){const r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1),w=Math.max(1,Math.round(r.width*d)),h=Math.max(1,Math.round(r.height*d));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}return{w,h,d};}
function drawChar(cx,key,anim,x,y,sc,flip,t){const ak='cha_'+key+'_'+anim,m=META[ak],im=img(ak);
  if(m&&im){const i=Math.floor(t*1000/m.ms)%m.n,f=m.f*sc;cx.save();cx.translate(x,y);if(flip)cx.scale(-1,1);cx.drawImage(im,i*m.cw,0,m.cw,m.ch,-m.ax*f,-m.ay*f,m.uw*f,m.uh*f);cx.restore();return m.uh*f*.8;}
  return drawStatic(cx,key,x,y,sc,flip);}
function drawStatic(cx,k,x,y,sc,flip){const m=META[k],im=img(k);if(!m||!im||!m.h)return 0;cx.save();cx.translate(x,y);if(flip)cx.scale(-1,1);cx.drawImage(im,-m.w*sc/2,-m.h*sc,m.w*sc,m.h*sc);cx.restore();return m.h*sc;}
function drawBg(cx,ch,w,h,gy,d){const cd=chapterDef(ch);cx.fillStyle='#0c0a16';cx.fillRect(0,0,w,h);
  if(cd.fl){const wi=img(cd.bg),fi=img(cd.fl);if(wi){const ih=gy+10*d,iw=wi.naturalWidth*ih/wi.naturalHeight;for(let x=(w-iw)/2-iw*Math.ceil((w-iw)/2/iw);x<w;x+=iw)cx.drawImage(wi,x,0,iw,ih);}
    if(fi){const ih=h-gy+20*d,iw=fi.naturalWidth*ih/fi.naturalHeight;for(let x=0;x<w;x+=iw)cx.drawImage(fi,x,gy-12*d,iw,ih);}}
  else{const im=img(cd.bg);if(im){const s=Math.max(w/im.naturalWidth,h/im.naturalHeight)*1.05,iw=im.naturalWidth*s,ih=im.naturalHeight*s;cx.drawImage(im,(w-iw)/2,Math.min(0,gy-ih*.82),iw,ih);}}
  const v=cx.createRadialGradient(w/2,h*.55,h*.2,w/2,h*.5,h*.9);v.addColorStop(0,'#0000');v.addColorStop(1,'#000b');cx.fillStyle=v;cx.fillRect(0,0,w,h);}
function bar(cx,x,y,w,hh,p,blk,col,d,label){cx.fillStyle='#000';cx.fillRect(x-2*d,y-2*d,w+4*d,hh+4*d);cx.fillStyle='#3a0e14';cx.fillRect(x,y,w,hh);
  const g=cx.createLinearGradient(0,y,0,y+hh);g.addColorStop(0,col[0]);g.addColorStop(1,col[1]);cx.fillStyle=g;cx.fillRect(x,y,w*clamp(p,0,1),hh);
  cx.fillStyle='#fff3';cx.fillRect(x,y,w*clamp(p,0,1),2*d);
  if(blk>0){cx.fillStyle='#000';cx.fillRect(x-1*d,y-8*d,w*clamp(blk,0,1)+2*d,7*d);cx.fillStyle='#5fd0ff';cx.fillRect(x,y-7*d,w*clamp(blk,0,1),5*d);}
  cx.font=Math.round(hh*1.1)+'px "Jersey 10",monospace';cx.textAlign='center';cx.textBaseline='middle';cx.lineWidth=3*d;cx.strokeStyle='#000';cx.strokeText(label,x+w/2,y+hh/2+1*d);cx.fillStyle='#fff';cx.fillText(label,x+w/2,y+hh/2+1*d);cx.textBaseline='alphabetic';}
function drawBattle(dt){const bt=battle,B=bt.B,cv=$('bcv'),{w,h,d}=fitCv(cv),cx=cv.getContext('2d'),t=performance.now()/1000;
  const gy=h*.82,sc=clamp(Math.min(h/330,w/300),.5,3),px=w*.26,ex=w*.72;
  cx.save();if(bt.shake>0){cx.translate(rnd(-bt.shake,bt.shake)*d,rnd(-bt.shake,bt.shake)*d);bt.shake*=.85;if(bt.shake<.3)bt.shake=0;}
  drawBg(cx,bt.ch,w,h,gy,d);
  const shadow=(x,rw)=>{cx.fillStyle='#0009';cx.beginPath();cx.ellipse(x,gy+2*d,rw*sc,8*sc,0,0,7);cx.fill();};
  for(const k of['P','E']){bt.pose[k]-=dt;bt.hurt[k]-=dt;}
  const hk='hero_'+bt.hero;shadow(px,36);
  cx.save();if(bt.hurt.P>0)cx.filter='brightness(2.2) saturate(.3)';if(B.over&&!B.win)cx.globalAlpha=clamp(1-bt.endT,0,1);
  const lunge=bt.pose.P>0?Math.sin(clamp(bt.pose.P/.25,0,1)*Math.PI)*16*sc:0;
  if(!(bt.pose.P>0&&drawStatic(cx,hk+'_attack',px+lunge,gy+7*sc,sc,false))&&!(bt.hurt.P>0&&drawStatic(cx,hk+'_hurt',px,gy+7*sc,sc,false)))drawChar(cx,hk+'_idle','idle',px,gy+7*sc,sc,false,t);
  cx.restore();
  const f=bt.foe,base=(f.kind==='boss'?'boss_':'enemy_')+f.k,atk=(f.kind==='boss'?'boss_attack_':'enemy_attack_')+f.k,fs=sc*(f.kind==='elite'?1.15:1);
  shadow(ex,36*(f.kind==='boss'?1.4:1));cx.save();if(bt.hurt.E>0)cx.filter='brightness(2.4) saturate(.2)';if(B.over&&B.win&&!B.vault)cx.globalAlpha=clamp(1-bt.endT,0,1);
  const el=bt.pose.E>0?-Math.sin(clamp(bt.pose.E/.3,0,1)*Math.PI)*16*sc:0;
  if(!(bt.pose.E>0&&drawStatic(cx,atk,ex+el,gy+7*fs,fs,true)))drawChar(cx,base,'idle',ex,gy+7*fs,fs,true,t+1.7);cx.restore();
  // projectiles
  bt.proj=bt.proj.filter(p=>(p.t+=dt*bt.speed)<.28);
  for(const p of bt.proj){const k=p.t/.28,x0=p.side==='P'?px+30*sc:ex-30*sc,x1=p.side==='P'?ex-20*sc:px+20*sc,x=x0+(x1-x0)*k,y=gy-70*sc-Math.sin(k*Math.PI)*(p.k==='bomb'?60:12)*sc;
    if(p.k==='arrow'){cx.save();cx.translate(x,y);if(p.side==='E')cx.scale(-1,1);cx.strokeStyle='#f3e7c4';cx.lineWidth=2.5*d;cx.beginPath();cx.moveTo(-22*sc,0);cx.lineTo(10*sc,0);cx.stroke();cx.fillStyle='#ddd';cx.beginPath();cx.moveTo(14*sc,0);cx.lineTo(6*sc,-4*sc);cx.lineTo(6*sc,4*sc);cx.fill();cx.restore();}
    else if(p.k==='bomb'&&img('sym_bomb')){const s=26*sc;cx.save();cx.translate(x,y);cx.rotate(k*8);cx.drawImage(img('sym_bomb'),-s/2,-s/2,s,s);cx.restore();}
    else{const col=p.side==='P'?'#c070ff':'#ff6a3a',g=cx.createRadialGradient(x,y,0,x,y,13*sc);g.addColorStop(0,'#fff');g.addColorStop(.35,col);g.addColorStop(1,col+'00');cx.fillStyle=g;cx.beginPath();cx.arc(x,y,13*sc,0,7);cx.fill();}}
  // fx sheets
  bt.fx=bt.fx.filter(q=>(q.t+=dt)*1000<META[q.k].d.reduce((a,b)=>a+b,0));
  for(const q of bt.fx){const m=META[q.k],im=img(q.k);if(!im)continue;let acc=0,i=0;for(;i<m.d.length;i++){acc+=m.d[i];if(q.t*1000<acc)break;}i=Math.min(i,m.n-1);
    const x=q.side==='P'?px:ex,fw=m.cw*sc*q.s,fh=m.ch*sc*q.s;cx.drawImage(im,i*m.cw,0,m.cw,m.ch,x-fw/2,gy-60*sc-fh/2,fw,fh);}
  // bars and status chips
  const bw=Math.min(w*.42,190*d),bh=Math.round(17*d),by=Math.max(54*d,gy-160*sc);
  bt.hpShow.P+=(B.P.hp-bt.hpShow.P)*.2;bt.hpShow.E+=(B.E.hp-bt.hpShow.E)*.2;
  bar(cx,px-bw/2,by,bw,bh,bt.hpShow.P/B.P.max,B.P.blk/B.P.max,['#8af06a','#2f9a2a'],d,Math.max(0,Math.ceil(B.P.hp))+'/'+B.P.max+(B.P.blk>0?'  🛡'+Math.round(B.P.blk):''));
  if(!B.vault)bar(cx,ex-bw/2,by,bw,bh,bt.hpShow.E/B.E.max,B.E.blk/B.E.max,f.kind==='boss'?['#ffb84a','#c0601a']:['#ff6a5a','#a01e1e'],d,Math.max(0,Math.ceil(B.E.hp))+'/'+B.E.max+(B.E.blk>0?'  🛡'+Math.round(B.E.blk):''));
  else{cx.font=Math.round(24*d)+'px "Jersey 10",monospace';cx.textAlign='center';cx.fillStyle='#ffd34a';cx.fillText('⏱ '+Math.max(0,20-B.t).toFixed(1)+'s   '+fmt(1e9-B.E.hp)+' dmg',ex,by+bh);}
  const chips=(X,x)=>{const c=[];if(X.burn>0)c.push('🔥'+X.burn);if(X.poison>0)c.push('☠'+X.poison);if(X.regen>0)c.push('✚'+Math.round(X.regen*10)/10);if(X.rage>0)c.push('💢'+Math.round(X.rage*100)+'%');if(X.thorns>0)c.push('🌵'+Math.round(X.thorns));
    if(!c.length)return;cx.font=Math.round(16*d)+'px "Jersey 10",monospace';cx.textAlign='center';const s=c.join('  ');cx.lineWidth=3*d;cx.strokeStyle='#000';cx.strokeText(s,x,by+bh+18*d);cx.fillStyle='#fff';cx.fillText(s,x,by+bh+18*d);};

/* =====================================================================
   BALANCE SIM — gbSim(ch, runs, {k}) plays whole runs with a bot shopper
   ===================================================================== */
function botValue(d){return(d.d?(d.d[0]+d.d[1])/2*(d.multi||1)/d.cd*4:0)+(d.blk||0)*.35+(d.blkN?d.blkN/d.blkCd*2:0)+(d.adj?3:0)+Math.max(0,d.hp||0)*.25+(d.heal?3:0)+(d.burn||0)*1.5+(d.poison||0)*2+(d.regen||0)*4;}
function botShop(){const R=run;
  for(let guard=0;guard<20;guard++){let best=null,bv=0;
    R.shop.forEach((s,i)=>{if(s.sold||s.price>R.gold)return;let v=botValue(IT[s.id])*TIER[s.t].m+(IT[s.id].gold&&R.round<6?4:0);if(mergeCandidates(s.id,s.t).length)v*=2.2;v/=s.price;if(v>bv){bv=v;best=i;}});
    if(best==null)break;const s=R.shop[best],it={u:uid++,id:s.id,t:s.t,g:'bag',x:0,y:0,r:0},mg=mergeCandidates(s.id,s.t);
    if(mg.length){R.gold-=s.price;s.sold=true;tryMerge(it,mg[0]);continue;}
    const sp=findSpot(it,'bag');
    if(!sp){const weak=R.items.filter(o=>o.g==='bag'&&o.t===0).sort((a,b)=>botValue(IT[a.id])-botValue(IT[b.id]))[0];
      if(weak&&botValue(IT[weak.id])<botValue(IT[s.id])){R.gold+=sellValue(weak);R.items=R.items.filter(o=>o!==weak);continue;}s.sold=true;continue;}
    R.gold-=s.price;s.sold=true;Object.assign(it,sp);R.items.push(it);}}
function gbSim(ch,n,opt){SIM=true;const keepRun=run,keepS=JSON.stringify(S);let wins=0,rounds=0,lives=0;n=n||20;
  try{if(opt&&opt.save)Object.assign(S,opt.save);
    for(let k=0;k<n;k++){newRunState(ch);const R=run;let guard=0;
    while(R.lives>0&&R.round<=12&&guard++<60){if(R.gold>=8&&Math.random()<.5){R.gold--;rollShop(false);}botShop();
      const foe=foeFor(ch,R.round,R.seed),B=battleState(R,foe);
      if(opt&&opt.k){B.P.max=B.P.hp=Math.round(B.P.max*opt.k);B.P.items.forEach(s=>{if(s.d)s.d=[s.d[0]*opt.k,s.d[1]*opt.k];});}
      let g=0;while(!B.over&&g++<8000)bStep(B,1/20);
      if(B.win)R.round++;else R.lives--;if(R.round>12)break;R.gold+=roundGold();rollShop(false);}
    const won=R.round>12;if(won){wins++;lives+=R.lives;}rounds+=won?12:R.round-1;}}
  finally{run=keepRun;S=JSON.parse(keepS);SIM=false;}
  return{wins:wins/n,round:rounds/n,livesLeft:wins?lives/wins:0};}
window.gbSim=gbSim;

/* ---------------- boot ---------------- */
load();renderAll();fillArt();requestAnimationFrame(stageLoop);
setInterval(()=>{if(!battle&&tab==='home'&&!$('run').classList.contains('on')){renderTop();$('expT').innerHTML='EXPEDITION<br><small style="color:#f6c84b">'+expTime()+'</small>';}},1000);
window.addEventListener('resize',()=>{renderAll();if(run&&$('run').classList.contains('on'))renderRun();});
if(S.log[0])$('tick').textContent=S.log[0];
requestAnimationFrame(()=>{const sc=document.createElement('script');sc.src='art.js?v=2';sc.onload=loadArt;document.head.appendChild(sc);});
</script>
