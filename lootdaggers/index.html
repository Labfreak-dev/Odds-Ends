<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Dead Man's Pull</title>
<meta name="description" content="A side-scrolling dungeon crawler where every step and every stab is decided by a slot machine. Coin in, pull, whatever lands is your turn.">
<meta name="theme-color" content="#120d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="512x512" href="app-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="app-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Dead Man's Pull">
<meta property="og:description" content="Coin in, pull, whatever lands is your turn. A side-scrolling dungeon crawl decided by a slot machine.">
<meta property="og:image" content="https://labfreak-dev.github.io/Odds-Ends/lootdaggers/share-card.jpg">
<meta property="og:url" content="https://labfreak-dev.github.io/Odds-Ends/lootdaggers/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://labfreak-dev.github.io/Odds-Ends/lootdaggers/share-card.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0a0b;--panel:#181415;--panel2:#221c1d;--ink:#e4d9c6;--dim:#948978;--gold:#cfa75c;--red:#b8453c;--blue:#7d9bb0;--green:#8aa35a;--line:#352c2c;--purple:#8e6fae;--orange:#c9763a;--head:'Pirata One',Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}
#app{width:100%;max-width:560px;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{display:flex;align-items:center;gap:6px;padding:8px 10px 6px;padding-top:max(8px,env(safe-area-inset-top));font-size:13px}
#hpwrap{flex:1;min-width:0;position:relative;height:20px;background:#1e0d0c;border:2px solid #000;border-radius:5px;overflow:hidden}
#hpbar{position:absolute;inset:0;width:100%;background:linear-gradient(#a3342c,#5e1510);transition:width .25s}
#hptxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;text-shadow:0 1px 0 #000}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap;font-weight:700}
#hudCoins{color:var(--gold)}
/* phones: the chips squeezed the life bar to a sliver, so it gets its own row */
@media (max-width:560px){
  #hud{flex-wrap:wrap;row-gap:6px}
  #hud .chip,#menuBtn{flex:1 1 0;min-width:0;text-align:center}
  #hpwrap{order:9;flex:1 1 100%;height:24px}
  #hptxt{font-size:14px;letter-spacing:.5px}
}
#hudBlock{color:var(--blue)}
#menuBtn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:15px}

/* ---------- scene ---------- */
#sceneWrap{position:relative;width:100%;flex:1 1 auto;min-height:150px;background:#0a0709}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#jackpotFlash{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none}
#jackpotFlash.go{animation:jp 3.4s ease-out}
@keyframes jp{0%{opacity:0}8%{opacity:.95}70%{opacity:.8}100%{opacity:0}}
#jackpotWord{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--head);font-size:min(19vw,96px);line-height:1;letter-spacing:2px;pointer-events:none;opacity:0;
  color:#a3130f;-webkit-text-stroke:2px #2a0402;
  text-shadow:0 0 2px #ff2a1a,0 3px 0 #3a0503,0 6px 0 #1a0201,0 0 22px rgba(255,40,20,.85),0 10px 18px #000}
#jackpotWord.go{animation:jw 3.8s cubic-bezier(.2,1.4,.4,1)}
#jackpotWord.gold{color:#d9b56a;-webkit-text-stroke:2px #3a2a08;text-shadow:0 0 2px #ffe08a,0 3px 0 #5a4010,0 6px 0 #2a1c06,0 0 22px rgba(255,210,90,.85),0 10px 18px #000}
#jackpotWord small{display:block;font-size:.34em;letter-spacing:4px;color:#e8d3a4;-webkit-text-stroke:0;text-shadow:0 2px 0 #000,0 0 12px #000;margin-top:6px}
@keyframes jw{0%{opacity:0;transform:scale(2.6) rotate(-6deg)}10%{opacity:1;transform:scale(1) rotate(-3deg)}14%{transform:scale(1.12) rotate(-3deg)}18%{transform:scale(1) rotate(-3deg)}
  84%{opacity:1;transform:scale(1.04) rotate(-3deg)}100%{opacity:0;transform:scale(1.2) rotate(-3deg)}}

#log{min-height:34px;padding:5px 10px;font-size:12px;color:var(--dim);border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#160f13;line-height:1.35}
#log b{color:var(--ink)}
#log .preview div{padding:1px 0}
#log .preview .hint{color:var(--gold);font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-top:3px}
#log{height:40px;overflow:hidden}
#forecast{position:absolute;left:8px;right:8px;top:8px;background:rgba(10,7,8,.82);border:2px solid #000;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.4;color:var(--ink);box-shadow:0 3px 0 #000;display:none;max-height:72%;overflow:auto}
#forecast.show{display:block}
#forecast div{padding:1px 0}
#forecast .hint{color:var(--gold);font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-top:3px}

/* ---------- slot machine ---------- */
#machine{flex:none;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:10px 12px;min-height:0}
#cabinet{position:relative;overflow:visible;background:linear-gradient(#3a302b,#1b1513);border:3px solid #000;border-radius:14px;padding:10px 10px 12px;box-shadow:inset 0 2px 0 #5d4c3f,inset 0 0 0 2px #2a211d,0 4px 0 #000}
#marquee{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#cdb68a;margin:0 4px 6px;letter-spacing:1px}
#reels{display:flex;gap:6px;height:min(33vw,168px,21dvh);position:relative;z-index:1}
#reelCtl{display:flex;gap:6px;margin-top:6px;position:relative;z-index:1}
#reelCtl .rc{flex:1;min-width:0;display:flex;gap:2px;justify-content:center;align-items:center}
#reelCtl button{border:2px solid #000;border-radius:6px;background:#221c1d;color:var(--ink);font-size:11px;padding:3px 0;box-shadow:0 2px 0 #000;font-weight:700}
#reelCtl .nbs{flex:0 0 16px;display:flex;flex-direction:column;gap:2px}
#reelCtl .nb{width:16px;height:14px;padding:0;font-size:8px;line-height:1;border-width:1px;border-radius:3px;box-shadow:0 1px 0 #000}
#reelCtl.many .hb .ico{display:none}
#reelCtl.many .hb{letter-spacing:0;font-size:10px}
#reelCtl .nb:disabled{visibility:hidden}
#reelCtl .nb:not(:disabled){background:linear-gradient(#e2bd6c,#8a6326);color:#1a1008;animation:nbPulse 1s ease-in-out infinite}
@keyframes nbPulse{50%{box-shadow:0 2px 0 #000,0 0 10px #e2bd6c}}
#reelCtl .hb{flex:0 1 78px;min-width:0;letter-spacing:1px}
#reelCtl .hb .ico{width:16px;height:16px;vertical-align:-3px;margin-right:2px}
#nudgeNote .ico{width:14px;height:14px;vertical-align:-3px}
#reelCtl .hb.on{background:linear-gradient(#cfa75c,#7d5a26);color:#1a1008}
#reelCtl button:disabled{opacity:.3}
#nudgeNote{font-size:10px;color:var(--gold);text-align:right;letter-spacing:1px;min-height:12px;margin-top:2px;position:relative;z-index:1}
.reel.held{box-shadow:0 0 0 3px #cfa75c,0 0 12px #cfa75c}
.reel .rtag{position:absolute;top:3px;left:0;right:0;text-align:center;font-size:10px;font-weight:800;letter-spacing:2px;color:#1a1008;pointer-events:none;z-index:3;display:none}
.reel.held .rtag{display:block}.reel.held .rtag::after{content:"HELD";background:#cfa75c;padding:1px 6px;border-radius:4px;border:1px solid #000}
.reel.jammed{filter:saturate(.4) brightness(.75)}
.reel.jammed .rtag{display:block}.reel.jammed .rtag::after{content:"JAMMED";background:#5a1f1f;color:#e4d9c6;padding:1px 6px;border-radius:4px;border:1px solid #000}
#cabinetArt{display:none}
#cabinet.art{background:none;border:none;box-shadow:none;padding:12% 9% 7%}
#cabinet.art #cabinetArt{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:0;pointer-events:none;filter:drop-shadow(0 4px 0 #000)}
#cabinet.art #marquee{position:relative;z-index:1;margin:0 0 4px}
#wheel{display:inline-flex;align-items:center;gap:3px;min-width:44px;justify-content:center;padding:1px 8px;border:2px solid #000;border-radius:999px;background:radial-gradient(#3a302b,#1b1513);color:#cdb68a;font-size:12px;box-shadow:0 2px 0 #000,inset 0 1px 0 #5d4c3f}
#wheel .ico{width:16px;height:16px}
#wheel.spin{color:#e4d9c6}
#wheel.up{color:#d9b56a;border-color:#7d5a26;box-shadow:0 0 8px rgba(217,181,106,.7),0 2px 0 #000}
#wheel.big{color:#fff0c0;background:radial-gradient(#7d5a26,#3a2a10);box-shadow:0 0 14px 3px rgba(255,210,90,.9),0 2px 0 #000;animation:winpulse .8s ease-in-out infinite}
#wheel.jam{color:#8e6fae;border-color:#5a1f1f;filter:saturate(.5)}
#lineInfo{flex:1;text-align:center}
#marquee.bonus #lineInfo{color:#d9b56a;font-weight:800;animation:winpulse 1s ease-in-out infinite}
.reel.art{background:#e2d9c5;background-size:100% 100%;border-color:#1a1412}
#spinBtn.art,#spinBtn.art.stop{background-color:transparent;background-size:100% 100%;background-position:center;border:none;box-shadow:none;text-shadow:0 2px 0 rgba(0,0,0,.35);padding:14px 8px}
#spinBtn.art.stop{color:#f1e6d2;text-shadow:0 2px 0 #000}
.gslot.art{background-color:transparent;background-size:100% 100%;border:none}
.mbox.art{background:#171213;border:28px solid transparent;border-image-slice:120 fill;border-image-width:28px;border-image-repeat:stretch;box-shadow:none;padding:2px 4px;border-radius:0}
.btn.art{background:#221c1d;border:14px solid transparent;border-image-slice:80 fill;border-image-width:14px;border-image-repeat:stretch;box-shadow:none;padding:4px 8px;border-radius:0;text-shadow:0 1px 0 #000}
.btn.art:disabled{opacity:.5}
.btn.art{position:relative;color:#f3e9d6}
.btn.art::before{content:"";position:absolute;inset:0;background:rgba(8,6,6,.5);pointer-events:none}
.btn.art .lbl{position:relative;z-index:1;text-shadow:0 1px 0 #000,0 0 6px #000}
.btn.art small{color:#dccfb6;font-size:12px}
.btn.art .ico,.btn.art .lbl .ico{filter:drop-shadow(0 0 1px #f0e2c4) drop-shadow(0 0 1px #f0e2c4) drop-shadow(0 2px 3px #000) brightness(1.12)}
.btn.art .ico.lead{width:44px;height:44px;float:none;margin:0;flex:none}
.btn.art .lbl{display:flex;align-items:center;gap:10px;min-height:46px}
.btn.art .lbl .txt{flex:1;min-width:0}
.btn.art .lbl small{margin-top:3px}
.btn{position:relative}
.price{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--gold);font-weight:800;white-space:nowrap}
.btn.art .price{right:16px;z-index:2;text-shadow:0 1px 0 #000,0 0 6px #000}
.btn .price .ico{width:26px;height:26px;vertical-align:-7px}
.hasPrice .txt,.hasPrice{padding-right:64px}
.btn.art .lbl .ico:not(.lead){width:1.7em;height:1.7em;vertical-align:-.45em;margin:0 2px}
.reel{flex:1;position:relative;overflow:hidden;background:linear-gradient(#8f8470,#d8ceb8 28%,#e2d9c5 50%,#d8ceb8 72%,#8f8470);border:3px solid #000;border-radius:8px;cursor:pointer}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(0,0,0,.35),transparent 25%,transparent 75%,rgba(0,0,0,.35))}
.reel .cell{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;font-size:min(9vw,44px,5.6dvh);line-height:1;will-change:transform}
.reel .cell img{width:78%;height:78%;object-fit:contain;image-rendering:auto}
.reel .cell .soul{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.reel .cell .soul img{position:relative;z-index:1;filter:drop-shadow(0 0 3px #ff4a3a) drop-shadow(0 0 1px #ff6a4a) brightness(1.1)}
.reel .cell .soul i{position:absolute;left:50%;top:50%;width:92%;height:92%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,60,40,.95) 0%,rgba(255,70,45,.85) 30%,rgba(255,130,40,.6) 48%,rgba(255,110,30,.35) 60%,rgba(255,90,20,0) 72%);filter:blur(2.5px);animation:emberglow 1.3s ease-in-out infinite;pointer-events:none;z-index:0}
@keyframes soulpulse{0%,100%{filter:drop-shadow(0 0 3px #ffb347) drop-shadow(0 0 6px #ff6a1a) brightness(1.15)}50%{filter:drop-shadow(0 0 5px #ffd36a) drop-shadow(0 0 12px #ff8a2a) brightness(1.3)}}
@keyframes emberglow{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(.95)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
#bulbs{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2}
#bulbs i{position:absolute;width:6.5%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;opacity:0;transition:opacity .4s}
#bulbs i.lit{opacity:1;background:radial-gradient(circle,#fff0c0 0%,#ff5a3a 35%,rgba(255,60,30,.55) 60%,rgba(255,60,30,0) 72%);box-shadow:0 0 10px 4px rgba(255,80,40,.75);animation:bulbpulse 1.6s ease-in-out infinite}
#bulbs i.new{animation:bulbpop .6s ease-out,bulbpulse 1.6s ease-in-out .6s infinite}
@keyframes bulbpulse{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes bulbpop{0%{transform:translate(-50%,-50%) scale(2.2);opacity:0}60%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-50%) scale(1)}}
#bulbsFallback{display:flex;gap:4px;justify-content:center;margin:2px 0 4px;position:relative;z-index:1}
#bulbsFallback i{width:10px;height:10px;border-radius:50%;background:#3a1a1c;border:1px solid #000}
#bulbsFallback i.lit{background:#ff5a3a;box-shadow:0 0 6px #ff5a3a}
.reel .cell.pay{background:rgba(217,181,106,.18)}
.reel .cell.pay::after{content:"";position:absolute;inset:9% 10%;pointer-events:none;border:2px solid rgba(201,118,58,.85);border-radius:10px;box-shadow:0 0 8px 1px rgba(201,118,58,.55);animation:paypulse 1.6s ease-in-out infinite}
.reel .cell.pay img{filter:drop-shadow(0 0 3px rgba(255,200,120,.8))}
@keyframes paypulse{0%,100%{opacity:.55}50%{opacity:1}}
.reel .cell.win{background-image:radial-gradient(circle,rgba(240,200,90,.95),rgba(240,200,90,0) 72%)!important;animation:winpulse 1.1s ease-in-out infinite}
.reel .cell.win::after{content:"";position:absolute;inset:5% 7%;pointer-events:none;border:3px solid #8a1410;border-radius:10px;box-shadow:0 0 0 2px #e8c96a,0 0 12px 3px rgba(255,210,90,.9),inset 0 0 10px rgba(138,20,16,.6);animation:winring 1.1s ease-in-out infinite}
.reel .cell.win img{transform:scale(1.18);filter:drop-shadow(0 0 4px #ffe6a8) drop-shadow(0 0 3px #ff9a3a)}
@keyframes winpulse{0%,100%{opacity:.8}50%{opacity:1}}
@keyframes winring{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.05);opacity:1}}}
.reel.stopped{border-color:#000}
.reel.live{border-color:#8a2a22}
.payrow{position:absolute;left:4px;right:4px;height:2px;background:rgba(242,193,78,.55);pointer-events:none;z-index:2}
#btnRow{display:flex;gap:8px;align-items:stretch}
#spinBtn{flex:1;font-family:var(--head);font-size:26px;font-weight:400;padding:10px 8px;border-radius:12px;border:3px solid #000;background:linear-gradient(#cfa75c,#7d5a26);color:#1a1008;box-shadow:0 4px 0 #000;letter-spacing:1px}
#spinBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #000}
#spinBtn.stop{background:linear-gradient(#a3342c,#4e110d);color:#e4d9c6}
#spinBtn:disabled{filter:grayscale(.7) brightness(.7)}
.sideBtn{border-radius:12px;border:3px solid #000;background:var(--panel2);font-size:18px;padding:0 12px;box-shadow:0 4px 0 #000}

/* ---------- gear bar ---------- */
#gearBar{display:flex;gap:6px;padding:6px 12px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom));align-items:center}
.gslot{width:44px;height:44px;flex:none;border-radius:8px;border:2px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;padding:0}
.gslot .lv{position:absolute;right:2px;bottom:0;font-size:9px;color:var(--dim)}
.gslot.empty{opacity:.35}
#relics{flex:1;display:flex;flex-wrap:wrap;gap:3px;min-width:0;max-height:60px;overflow:hidden}
.relic{width:28px;height:28px;font-size:15px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border-radius:5px;border:1px solid var(--line);padding:0}

/* ---------- modal ---------- */
#modal{position:absolute;inset:0;background:rgba(8,5,7,.78);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.show{display:flex}
#peek{position:absolute;inset:0;background:rgba(8,5,7,.7);display:none;align-items:center;justify-content:center;z-index:60;padding:14px}
#peek.show{display:flex}
#peek .mbox{position:relative;padding-top:10px}
#peek .mbox .mbody{padding-right:0}
#peekX{position:sticky;top:0;float:right;margin:0 18px 0 0;width:36px;height:36px;border:2px solid #000;border-radius:8px;background:#4a1512;color:#f1e6d2;font-size:20px;font-weight:800;box-shadow:0 2px 0 #000;z-index:3;line-height:1}
.mbox.art #peekX{margin-right:10px}
.peekBtn .ico{width:22px;height:22px;vertical-align:-6px;margin-right:2px;filter:drop-shadow(0 0 1px #f0e2c4)}
.peekBtn{display:block;width:92px;margin:6px 0 0;padding:6px 4px;font-size:12px;text-align:center;border:2px solid #000;border-radius:8px;background:var(--panel2);color:var(--ink);box-shadow:0 2px 0 #000}
.merchCol{float:right;margin:0 0 6px 12px;width:92px}
.merchCol .port{float:none;margin:0;width:92px;height:136px}
.peekRelics{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.peekRelics .relic{width:40px;height:40px}
.peekRelics .relic .ico{width:34px;height:34px}
.peekRow{display:flex;gap:8px;align-items:center;margin:4px 0}
.mbox{width:100%;max-width:440px;max-height:92dvh;overflow:auto;background:var(--panel);border:3px solid #000;border-radius:14px;padding:14px;box-shadow:0 6px 0 #000}
.mbox h2{margin:0 0 8px;font-family:var(--head);font-weight:400;font-size:26px;color:var(--gold);letter-spacing:.5px}
.mbody{font-size:13px;line-height:1.45;color:var(--ink)}
.mbody p{margin:6px 0}
.mbtns{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.btn{border:2px solid #000;border-radius:10px;background:var(--panel2);padding:10px 12px;font-size:14px;text-align:left;box-shadow:0 3px 0 #000}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(#cfa75c,#7d5a26);color:#1a1008;font-weight:800;text-align:center}
.btn.danger{background:#4a1512}
.btn.center{text-align:center}
.btn:disabled{opacity:.45}
.btn small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.btn.primary small{color:#3a2710}
/* the lever on Labfreak's grave: an oozing iron plate with a green glow (art pack 15),
   or a dark plate with a glowing green rim until the art exists */
.btn.primary.ooze{position:relative;border:2px solid #5fd35a;border-radius:8px;background:linear-gradient(#1d2a1b,#0b120a);color:#c9ffc0;
  font-family:var(--head);font-weight:400;font-size:26px;letter-spacing:1px;padding:14px 12px 16px;text-shadow:0 0 8px #8cff96,0 2px 0 #000;
  box-shadow:0 0 10px rgba(140,255,150,.55),inset 0 0 14px rgba(140,255,150,.25);animation:oozeGlow 1.8s ease-in-out infinite}
/* nine-slice: the riveted corners and the drips keep their shape at any button width */
.btn.primary.ooze.hasArt{border-style:solid;border-color:transparent;border-width:28px 24px 32px;border-radius:0;background:none;box-shadow:none;padding:0 6px 2px;
  border-image:var(--oozeArt) 100 84 110 84 fill / 28px 24px 32px stretch;
  filter:drop-shadow(0 0 5px rgba(140,255,150,.6));animation:oozeGlowArt 1.8s ease-in-out infinite}

<script>
'use strict';
/* =====================================================================
   LOOT & DAGGERS — Loot Dungeon x Slots & Daggers
   Side-scrolling crawl; every action comes off the slot machine.
   ===================================================================== */
const $=s=>document.querySelector(s);
const NATIVE_RANDOM=Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
const strHash=str=>{let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;};
const todayKey=()=>new Date().toISOString().slice(0,10);
function seedRandom(seed){Math.random=seed==null?NATIVE_RANDOM:mulberry32(strHash(seed));}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mod=(a,n)=>((a%n)+n)%n;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- data ---------------- */
const SYM={
  sword:{e:'🗡️',n:'Dagger',d:'Stab the foe or chest directly ahead.'},

  bomb:{e:'💣',n:'Bomb',d:'Blast everything within 2 tiles.'},

const HEROES={
  knight:{n:'Knight',e:'🛡️',hp:30,coins:20,cost:0,col:'#a9bdd2',trim:'#d9b56a',
    strip:{sword:4,boots:4,shield:3,coin:3,potion:1,skull:1,key:1},d:'Sturdy all-rounder. An extra Shield on the reels.'},

    strip:{sword:2,bow:3,boots:4,shield:2,coin:3,potion:1,skull:1,key:1},d:'Bows hit from 4 tiles away. Fewer daggers, fatter purse.'},
  gambler:{n:'Gambler',e:'🎲',hp:22,coins:28,cost:300,col:'#d9b56a',trim:'#8a2b8a',luck:15,

};

const ENEMIES={
  rat:{n:'Cellar Rat',hp:6,pat:[['atk',2]],coins:[1,2],from:1},
  skel:{n:'Skeleton',hp:10,pat:[['atk',3],['atk',3],['guard',4]],coins:[1,3],from:1},
  archer:{n:'Bone Archer',hp:8,range:4,pat:[['atk',2],['atk',3]],coins:[2,3],from:2},

  wraith:{n:'Coin Wraith',hp:12,range:2,pat:[['drain',3],['atk',3]],coins:[2,4],from:4},

  croupier:{n:'Cursed Croupier',hp:14,range:2,pat:[['jam',0],['atk',3],['atk',3]],coins:[3,5],from:3,d:'Jams one of your reels on a Skull until it dies.'},
  taxman:{n:'Tax Collector',hp:12,range:3,pat:[['tax',1],['atk',2]],coins:[5,8],from:3,d:'Every spin costs +1 coin while it is awake.'},
  mirror:{n:'Mirror Wight',hp:16,pat:[['atk',3],['atk',4]],coins:[3,5],from:5,d:'Every dagger hit sends a small shard back at you (1 damage, more on deeper floors). Block stops it.'},
  ironclad:{n:'Ironclad Husk',hp:20,pat:[['atk',5],['guard',6]],coins:[4,6],from:5,d:'Only bombs, shoves and jackpot turns can hurt it.'},
  abom:{n:'Stitched Abomination',hp:26,pat:[['atk',6],['grow',5],['atk',7]],coins:[4,7],from:99,loot:.4,d:'Stitches itself back together.'},
  homunculus:{n:'Jar Homunculus',hp:9,pat:[['drain',2],['atk',3]],coins:[2,4],from:99,d:'Needle fingers: it drains coins.'},
  brainjar:{n:'Brain in a Jar',hp:14,range:3,pat:[['curse',1],['atk',4]],coins:[3,5],from:99,d:'Zaps from range and curses your reels.'},
  reaper:{n:'The Reaper',hp:40,range:2,pat:[['drain',6],['atk',8],['atk',5]],coins:[8,12],from:99,loot:1,d:'Summoned by Doom. Slaying it pays 25 souls.'},
};
const ELITES={fast:{n:'Frenzied',e:'⚡',d:'acts twice a turn'},shield:{n:'Warded',e:'🛡️',d:'regains 5 block every turn'},cursed:{n:'Hexed',e:'💀',d:'its hits add a Skull to your reels'}};
const FLOOR_KINDS={fight:{e:'⚔️',n:'Fight',d:'The usual crawl.'},treasure:{e:'📦',n:'Treasure',d:'Extra chests and coin piles. One chest bites.'},elite:{e:'👑',n:'Elite',d:'A modified foe guards a guaranteed Rare.'},rest:{e:'🕯️',n:'Rest',d:'A short, quiet floor. Heal 30% and find a shrine.'},boss:{e:'☠️',n:'Boss',d:'Something big waits at the end.'},lab:{e:'⚗️',n:'Laboratory',d:'Dr. Labfreak\'s secret lab.'}};

/* ---------------- gravestones (easter egg) ----------------

const graveArtReady=()=>!!artImg('grave_madness')||!!window.LD_GRAVE_TEST;
const graveRead=id=>(S.graves||[]).includes(id);
const graveDef=id=>GRAVES.find(g=>g.id===id);
function graveKey(o){return 'grave_'+o.who+(o.who==='labfreak'&&o.lever?'_lever':'');}
// which grave (if any) to put on this floor
function graveFor(f){
  if(!graveArtReady())return null;
  const five=GRAVES.slice(0,5).filter(g=>!graveRead(g.id)).map(g=>g.id);
  if(five.length)return Math.random()<.4?pick(five):null;
  if(!graveRead('labfreak'))return Math.random()<.5?'labfreak':null;
  return Math.random()<.15?pick(GRAVES).id:null;
}
// Two in three obituaries come off the shared deck of 50; the rest are built from
// the person's own lines (or their own written ones), so each grave sounds like its owner.
function nextObit(){
  if(!Array.isArray(S.obitDeck)||!S.obitDeck.length)S.obitDeck=shuffle(OBITS.map((_,i)=>i));
  const i=S.obitDeck.pop();save();return OBITS[i]||OBITS[0];
}
// A grave with its own written obituaries (Madness, PapaModelo) deals half of its
// obituaries from its own deck, in rotation, instead of the mixed-and-matched lines.
function nextSpecial(g){
  if(!S.obitDecks||typeof S.obitDecks!=='object')S.obitDecks={};
  let d=S.obitDecks[g.id];if(!Array.isArray(d)||!d.length)d=S.obitDecks[g.id]=shuffle(g.special.map((_,i)=>i));
  const i=d.pop();save();return g.special[i]||g.special[0];
}
function obitBody(g){
  const nm=`<b>${esc(g.n)}</b>`;
  const card=([a,b,last])=>{const fill=t=>esc(t).replace(/\{n\}/g,(m,off)=>off===0?nm:esc(g.n));
    return `<p>${fill(a)}</p><p>${fill(b)} ${pick(GRAVE_SERVICE)}</p><p class="olast">Last words: “${esc(last)}”</p>`;};
  if(g.special)return card(Math.random()<.5?nextSpecial(g):nextObit());
  if(Math.random()<2/3)return card(nextObit());
  return `<p>${nm}, ${pick(g.tag)}, died ${pick(g.cause)}.</p>
    <p>${pick(g.life)} ${pick(g.quirk)}</p>
    <p>${pick(g.left)}. ${pick(GRAVE_SERVICE)}</p>
    <p class="olast">Last words: “${pick(g.last)}”</p>`;
}
function obituaryHTML(g){
  const died=`Floor ${rnd(1,40)}, spin ${rnd(12,999)}`;
  return `<div class="obit"><div class="mast">The Dungeon Gazette</div><div class="sect">Obituaries</div>
    ${portImg('portrait_'+g.id,'obitPic')||'<div class="obitPic none">🪦</div>'}
    <div class="onm">${esc(g.n)}</div><div class="odates">Born ${pick(GRAVE_BORN)} · Died ${died}</div>
    ${obitBody(g)}</div>`;
}
// Obituaries open in their own layer, so a grave can be read at any moment, even
// while the hero is walking or the reels are turning. A grave only counts as
// found once its obituary is closed with Rest in peace.
let obitOpen=false;
function obitLayer(title,html){
  return new Promise(res=>{
    let el=$('#obitLayer');if(!el){el=document.createElement('div');el.id='obitLayer';$('#app').appendChild(el);}
    const A=window.LD_ART||{};
    el.innerHTML=`<div class="mbox ${A.ui_panel?'art':''}" ${A.ui_panel?`style="border-image-source:url(${A.ui_panel})"`:''}><h2>${artify(title)}</h2><div class="mbody">${html}</div><div class="mbtns"><button class="btn center ${A.ui_button?'art':''}" ${A.ui_button?`style="border-image-source:url(${A.ui_button})"`:''}>${A.ui_button?'<span class="lbl"><span class="txt">Rest in peace</span></span>':'Rest in peace'}</button></div></div>`;
    el.classList.add('show');el.querySelector('.mbox').scrollTop=0;obitOpen=true;
    el.querySelector('.mbtns button').onclick=()=>{el.classList.remove('show');obitOpen=false;res(1);};
  });
}
async function readGrave(o){
  const g=graveDef(o.who);if(!g||obitOpen)return;
  await obitLayer('Here lies '+g.n,obituaryHTML(g));
  if(!S.graves)S.graves=[];

// Biome-tied tracks, cross-faded. Two <audio> elements alternate so a track can
// overlap its own ending and loop without a gap. Starts on the first tap.
const TRACKS={hub:'darkforest',crypt:'catacombs',2:'coldwind',3:'tombs',4:'darkforest',boss:'tombs'};
const music={a:null,b:null,cur:null,key:null,fade:2.2,started:false,timer:null,
  el(){const e=new Audio();e.preload='auto';e.volume=0;return e;},
  vol(){return S.music===false?0:(S.musicVol==null?.6:S.musicVol);},
  ramp(e,to,secs,stop){if(!e)return;const from=e.volume,t0=performance.now();const step=()=>{const p=Math.min(1,(performance.now()-t0)/(secs*1000));e.volume=Math.max(0,Math.min(1,from+(to-from)*p));if(p<1)requestAnimationFrame(step);else if(stop){e.pause();}};step();},
  play(key){
    if(!key||key===this.key){this.key=key;this.apply();return;}
    this.key=key;if(!this.started)return;
    const next=this.cur===this.a?this.b:this.a;const old=this.cur;
    next.src='music/'+TRACKS[key]+'.mp3';next.currentTime=0;next.volume=0;
    next.play().catch(()=>{});this.cur=next;
    this.ramp(next,this.vol(),this.fade);if(old)this.ramp(old,0,this.fade,true);
  },
  tick(){ // near the end of the current track, start it again on the other element and cross-fade
    const c=this.cur;if(!c||!this.started||!c.duration||c.paused)return;
    if(c.duration-c.currentTime<this.fade+.1&&!c.dataset.looping){c.dataset.looping='1';
      const next=c===this.a?this.b:this.a;next.src=c.src;next.currentTime=0;next.volume=0;next.play().catch(()=>{});
      this.cur=next;delete next.dataset.looping;this.ramp(next,this.vol(),this.fade);this.ramp(c,0,this.fade,true);}
  },
  start(){if(this.started)return;this.started=true;this.a=this.el();this.b=this.el();
    const k=this.key||'hub';this.key=null;this.play(k);this.timer=setInterval(()=>this.tick(),250);},
  apply(){if(this.cur)this.cur.volume=this.vol();if(this.cur&&S.music===false)this.cur.pause();else if(this.cur&&this.cur.paused&&this.started)this.cur.play().catch(()=>{});},
};

function tone(f,d=.06,type='square',vol=.035,slide=0){
  if(S.mute)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    vol*=(S.sfxVol==null?1:S.sfxVol);if(vol<=0)return;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}

function genFloor(f){

  const len=kind==='rest'?8:12+Math.min(f,10);

  const free=[];for(let i=3;i<len-(boss?2:1);i++)free.push(i);shuffle(free);
  const put=o=>{r.objs.push(Object.assign({id:uid++,dx:o.x*T},o));};
  put({kind:'door',x:len});
  if(boss){const b=BOSS_ORDER[(f/3-1)%3];put(mkEnemy(b,len-2,f,true));}
  const pool=Object.keys(ENEMIES).filter(k=>ENEMIES[k].from<=f);
  let ne=boss?Math.min(3,1+Math.floor(f/4)):Math.min(6,2+Math.floor(f/2));

    if(e){e.elite=pick(Object.keys(ELITES));e.n=ELITES[e.elite].n+' '+e.n;e.hp=e.max=Math.round(e.max*1.6);e.loot=1;e.minRar=2;e.coins=[e.coins[0]+3,e.coins[1]+5];}}

  if(r.doom>=3&&!boss){r.doom=0;const rp=mkEnemy('reaper',Math.min(5,len-3),f);rp.big=true;put(rp);r.reaperDue=true;}
  let nc=boss?0:rnd(1,2);if(kind==='treasure')nc+=2;if(kind==='rest')nc=0;
  for(let i=0;i<nc&&free.length;i++)put({kind:'chest',x:free.pop(),hp:4,mimic:kind==='treasure'?i===0:(f>=2&&Math.random()<.15)});
  if((kind==='rest'||(!boss&&(f===2||Math.random()<.35)))&&free.length)put({kind:'shrine',x:free.pop()});
  if(kind!=='rest')for(let i=0;i<rnd(0,2)&&free.length;i++)put({kind:'trap',x:free.pop(),dmg:3+Math.floor(f/2)});
  for(let i=0;i<rnd(1,3)+(kind==='treasure'?1:0)&&free.length;i++)put({kind:'coins',x:free.pop(),v:rnd(1,3)+Math.floor(f/3)});
  if(kind==='rest'){r.hp=Math.min(stats().maxHp,r.hp+Math.round(stats().maxHp*.3));}
  if(!boss&&free.length){const who=graveFor(f);if(who)put({kind:'grave',x:free.pop(),who});}
  r.objs.sort((a,b)=>a.x-b.x);
  view.hx=T/2;view.cam=T/2-HERO_SX;
  view.banner=boss?{t:performance.now(),txt:BOSSES[BOSS_ORDER[(f/3-1)%3]].n.toUpperCase()}:r.reaperDue?{t:performance.now(),txt:'THE REAPER COMES'}:null;r.reaperDue=false;
}

    // Whatever is in the window stays put: only the unseen part of the strip is
    // reshuffled, so a hex, relic or new floor never swaps symbols in front of you
    // (they showed symbols that had not landed, and did not count).
    const t=Math.round(R.o),old=R.strip,seen=old.length?[-2,-1,0,1,2].map(k=>old[mod(t+k,old.length)]):null;
    const strip=shuffle(arr),len=strip.length,o=mod(t,len);

      seen.forEach((sym,idx)=>{const at=mod(o+idx-2,len);lock.add(at);if(strip[at]===sym)return;

// Extra coins for holding reels: 1 reel, 2, 3, 4 (five reels max, one must spin).
const HOLD_COST=[0,1,11,32,144];
// Reel Clamp pays for two holds; a third and fourth cost the difference.
function holdCost(held){const c=HOLD_COST[Math.min(held,4)];return hasR('clamp')?Math.max(0,c-HOLD_COST[2]):c;}
function spinCost(){
  if(!run)return 1;const held=M.reels.filter(R=>R.held&&!R.jam).length;
  const tax=run.objs.filter(o=>o.kind==='enemy'&&!o.gone&&o.t==='taxman'&&o.x-run.x<=6).length;

function spin(){

  const cost=spinCost();if(run.coins<cost){logLine(`Not enough coins: this spin costs <b>${cost}</b>.`);return;}
  run.coins-=cost;if(run.freeSpin)run.freeSpin=false;
  if(run.bonus>0){run.bonus--;}
  run.spins++;M.spinning=true;M.nudges=nudgeMax()+(run.inBonus?1:0);
  M.wheel=rollWheel();M.wheelSpin={face:1,last:0,gap:70};drawWheel();
  if(run.daily)seedRandom(run.daily+':'+run.spins);
  document.querySelectorAll('.cell.win,.cell.pay').forEach(c=>c.classList.remove('win','pay'));
  const v=S.mods.slow?7.5:12;
  M.reels.forEach((R,c)=>{if(R.held||R.jam){R.spinning=false;R.settle=null;return;}R.spinning=true;R.settle=null;R.v=v*(1+c*.07);R.el.classList.add('live');R.el.classList.remove('stopped');});
  buildReelCtl();

}
function stopNext(){const R=M.reels.find(x=>x.spinning&&!x.settle);if(R)stopReel(R);}
function stopReel(R){

function tickReels(now,dt){
  if(!M.spinning)return;tickWheel(now);
  let all=true;
  for(const R of M.reels){
    if(R.settle){const p=clamp((now-R.settle.t0)/R.settle.dur,0,1);
      const e=1+2.2*Math.pow(p-1,3)+1.2*Math.pow(p-1,2);
      R.o=R.settle.from+(R.settle.to-R.settle.from)*e;
      if(p>=1){R.o=R.settle.to;R.settle=null;R.spinning=false;R.el.classList.remove('live');R.el.classList.add('stopped');}
    }else if(R.spinning)R.o+=R.v*dt;
    if(R.spinning)all=false;
  }

  if(all){M.spinning=false;M.timers.forEach(clearTimeout);M.timers=[];M.reels.forEach(R=>{R.held=false;R.el.classList.remove('held');});M.wheelSpin=null;drawWheel();if(M.wheel>1)sfx.coin();onAllStopped();}
}
function readGrid(){

function buildReelCtl(){
  let box=$('#reelCtl');if(!box){box=document.createElement('div');box.id='reelCtl';$('#cabinet').appendChild(box);}
  const idle=!!run&&!M.spinning&&!busy;const canNudge=idle&&!!M.pendingRes&&M.nudges>0;
  box.innerHTML=M.reels.map((R,i)=>`<div class="rc">
    <button class="hb ${R.held?'on':''}" data-i="${i}" ${idle&&!R.jam?'':'disabled'}>${icon('ui_hold','')}${R.jam?'JAMMED':R.held?'HELD':'HOLD'}</button>
    <span class="nbs"><button class="nb up" data-i="${i}" ${canNudge&&!R.jam?'':'disabled'}>▲</button><button class="nb dn" data-i="${i}" ${canNudge&&!R.jam?'':'disabled'}>▼</button></span></div>`).join('');
  box.classList.toggle('many',M.reels.length>3);
  const nudgeNote=$('#nudgeNote');if(nudgeNote)nudgeNote.innerHTML=canNudge?`${icon('ui_nudge','')} nudge ▲▼ · ${M.nudges} left`:'';
}
function toggleHold(i){const R=M.reels[i];if(!R||M.spinning||busy||R.jam)return;R.held=!R.held;R.el.classList.toggle('held',R.held);buildReelCtl();setBtn(M.pendingRes?'resolve':'spin');
  const n=M.reels.filter(x=>x.held).length;if(n)logLine(`Holding ${n} reel${n>1?'s':''}: next spin costs <b>${spinCost()}</b> 🪙.`);}
function nudge(i,dir){
  const R=M.reels[i];if(!R||!M.pendingRes||M.spinning||busy||M.nudges<=0||R.jam)return;
  R.o=Math.round(R.o)+dir;M.nudges--;sfx.stop();drawReels(true);
  document.querySelectorAll('.cell.win,.cell.pay').forEach(c=>c.classList.remove('win','pay'));
  const res=finishRes(evaluate(readGrid()));markCells(res.pays,'pay');markCells(res.wins,'win');if(res.triples)sfx.jackpot();
  M.pendingRes=res;showForecast(previewTurn(res));buildReelCtl();
  if(S.autoResolve||M.autoBonus)autoResolveLater();
}
// Pair combos: two symbols sharing a payline add a twist to the turn.
const COMBOS={charge:{a:'boots',b:'sword',n:'Charge',d:'first dagger hit deals double'},stabbomb:{a:'sword',b:'bomb',n:'Shrapnel',d:'the blast also stabs what is ahead'},mend:{a:'shield',b:'potion',n:'Mend',d:'block also heals half its value'}};
function evaluate(grid){
  const n=grid.length,s=stats(),units={},wins=[],pays=[],combos={};let triples=0;
  for(const L of paylines(n)){
    const syms=L.r.map((row,c)=>grid[c][row]);
    L.r.forEach((row,c)=>pays.push([c,row]));
    const cnt={};let wild=0;
    syms.forEach(x=>{x=x==='scoin'?'coin':x;x==='star'?wild++:cnt[x]=(cnt[x]||0)+1;});
    if(wild){let best=null;for(const k of SYM_ORDER){if(k==='skull'||k==='star')continue;if(cnt[k]&&(!best||cnt[k]>cnt[best]))best=k;}
      best=best||'sword';cnt[best]=(cnt[best]||0)+wild;}
    for(const c in COMBOS)if(cnt[COMBOS[c].a]&&cnt[COMBOS[c].b])combos[c]=true;
    for(const k in cnt){
      const c=cnt[k];let mult=1;
      if(c>=3&&k!=='skull'){mult=c+s.triple;triples++;
        L.r.forEach((row,ci)=>{const sy=grid[ci][row];if(sy===k||sy==='star')wins.push([ci,row]);});}
      units[k]=(units[k]||0)+c*mult;
    }
  }
  return {units,triples,wins,pays,combos};
}
function markCells(list,cls){
  for(const [c,row] of list){const R=M.reels[c];if(!R)continue;const i=(1-row)+2;R.cells[i]&&R.cells[i].classList.add(cls);}
}
async function onAllStopped(){
  busy=true;setBtn('busy');
  const grid=readGrid();const res=finishRes(evaluate(grid));
  markCells(res.pays,'pay');markCells(res.wins,'win');
  if(res.triples)sfx.jackpot();
  if(res.bonusTrigger){bonusFlash();sfx.jackpot();}
  // show what the reels will do, then wait for RESOLVE (or auto-resolve after a beat)
  showForecast(previewTurn(res));logLine('Reels stopped. <b>Read the forecast, then resolve.</b>');M.pendingRes=res;setBtn('resolve');busy=false;ui();buildReelCtl();
  if(S.autoResolve||M.autoBonus)autoResolveLater();
}
// Auto-resolve after a beat; with nudges left the beat is long enough to use them,
// and every nudge starts it again.
async function autoResolveLater(){const my=M.arTok=(M.arTok||0)+1;await (M.nudges>0&&!M.autoBonus?new Promise(r=>setTimeout(r,4000)):sleep(M.autoBonus?900:1400));   // decision time is real time, fast mode or not
  if(my===M.arTok&&M.pendingRes&&!M.spinning&&!busy)await resolveTurn();}
async function resolveTurn(){
  const res=M.pendingRes;if(!res||busy||!run||run.over)return;M.pendingRes=null;showForecast('');buildReelCtl();
  busy=true;setBtn('busy');
  try{await doTurn(res);}catch(e){console.error(e);}
  busy=false;
  if(run&&!run.over){setBtn('spin');ui();buildReelCtl();save();
    // free spins run themselves: spin again while the bonus lasts
    if(run.inBonus&&run.bonus>0&&!S.bonusManual){M.autoBonus=true;await sleep(700);if(run&&!run.over&&!modalOpen&&!M.spinning&&!M.pendingRes)spin();else M.autoBonus=false;}
    else M.autoBonus=false;}
}

// A plain-words forecast of the turn the reels just dealt, in resolution order.
function previewTurn(R){
  const r=run,s=stats(),u=R.units,val=k=>u[k]||0,L=[];
  const nm=o=>o.kind==='chest'?(o.mimic?'the chest':'the chest'):o.n;
  if(R.triples)L.push(`<b style="color:var(--gold)">${R.triples>1?'DOUBLE ':''}JACKPOT</b> — matched symbols pay x3${hasR('bell')?', +3 🪙 from the Bell':''}`);
  for(const c in (R.combos||{}))L.push(`<b style="color:var(--orange)">COMBO · ${COMBOS[c].n}</b> — ${COMBOS[c].d}`);
  if(R.mult>1)L.push(`<b style="color:var(--gold)">FORTUNE ×${R.mult}</b> — damage and block ×${R.mult}`);
  if(r.wheelJam)L.push(`<span style="color:var(--purple)">the Bandit has jammed the wheel at ×1 — a jackpot frees it</span>`);
  if(R.gain&&!R.bonusTrigger)L.push(`<span style="color:var(--orange)">✦ ${R.soul} soul coin${R.soul>1?'s':''} — <b>${R.gain} bulb${R.gain>1?'s':''} light${R.gain>1?'':'s'}</b> (${Math.min(BULBS,(r.bulbs||0)+R.gain)}/${BULBS})${r.inBonus&&(r.bulbs||0)+R.gain>=BULBS?' — another bonus once this one ends':''}</span>`);
  if(R.bonusTrigger)L.push(`<b style="color:var(--gold)">✦ ALL BULBS LIT</b> — <b>${hasR('longstreak')?5:3} free spins</b>${S.bonusManual?' from the next pull':', the reels run themselves'}`);
  if(r.inBonus&&!R.bonusTrigger)L.push(`<span style="color:var(--gold)">★ bonus: ${r.bonus} free spin${r.bonus===1?'':'s'} left after this</span>`);
  if(val('skull')&&!hasR('skullring')&&!hasR('beaker')){const d=(r.doom||0)+val('skull')*(hasR('scythe')?2:1);L.push(d>=3?`<span style="color:var(--purple)">☠ Doom ${Math.min(d,3)}/3 — <b>the Reaper comes next floor</b></span>`:`<span style="color:var(--purple)">☠ Doom ${d}/3</span>`);}
  const mu=R.mult||1;
  if(val('shield'))L.push(`🛡 block <b>${val('shield')*s.blockPer*mu}</b>`);
  if(r.poison&&r.poison.turns>0)L.push(`<span style="color:#8cff96">☣ poisoned: ${r.poison.dmg} a turn for ${r.poison.turns} more turn${r.poison.turns>1?'s':''}${val('potion')?' · the potion cures it':' · a Potion cures it'}</span>`);
  if(val('potion'))L.push(`🧪 heal <b>${val('potion')*s.healPer}</b>`);
  if(val('coin'))L.push(`🪙 +<b>${val('coin')*s.coinPer}</b> coins`);
  if(val('skull'))L.push(hasR('beaker')?`⚗ Beaker: acid on the nearest foe for <b>${val('skull')*5}</b>, arcing to the next for <b>${val('skull')*3}</b>`:hasR('skullring')?`💀 Skull Ring: +<b>${val('skull')}</b> coins`:`💀 take <b>${val('skull')*s.skullDmg}</b> (ignores block)`);
  if(val('key')){const ch=r.objs.find(o=>o.kind==='chest'&&!o.gone&&o.x>r.x&&o.x-r.x<=3);L.push(ch?`🗝 open the chest ${ch.x-r.x} tile${ch.x-r.x>1?'s':''} ahead`:`🗝 no chest in reach: +1 🪙`);}
  // walk the boots forward on a copy of the map
  let x=r.x,steps=val('boots')*s.move+(val('boots')?s.moveBonus:0),moved=0,shoves=0,shoveT=null,door=false;
  for(let i=0;i<steps;i++){const b=blockerAt(x+1);if(b){shoves++;shoveT=b;continue;}x++;moved++;if(r.objs.some(o=>o.kind==='door'&&o.x===x)){door=true;break;}}
  if(steps){const bits=[];if(moved)bits.push(`step <b>${moved}</b>`);if(shoves)bits.push(`shove ${nm(shoveT)} <b>${shoves}×${s.shove}</b>`);if(door)bits.push('<b>reach the exit</b>');L.push('🥾 '+bits.join(', '));}
  const mom=hasR('momentum')?moved:0;
  if(!door){
    if(val('sword')){const t=blockerAt(x+1);L.push(t?`🗡 stab ${nm(t)} for <b>${(val('sword')*s.swordDmg+mom)*mu*((R.combos||{}).charge?2:1)}</b>`:`🗡 nothing in reach: <b>whiff</b>`);}
    if(val('bow')){const es=r.objs.filter(o=>o.kind==='enemy'&&!o.gone&&o.x>x&&o.x-x<=4).sort((a,b)=>a.x-b.x);L.push(es[0]?`🏹 shoot ${es[0].n} for <b>${(val('bow')*s.bowDmg+mom)*mu}</b>${hasR('quiver')&&es[1]?`, ${es[1].n} for half`:''}`:'🏹 no target in 4 tiles');}
    if(val('bomb')){const ts=r.objs.filter(o=>!o.gone&&(o.kind==='enemy'||o.kind==='chest')&&o.x>x&&o.x-x<=2);L.push(`💣 blast ${ts.length?ts.map(nm).join(', '):'nothing'} for <b>${(val('bomb')*s.bombDmg+mom)*mu}</b>`);}
    const foes=r.objs.filter(o=>o.kind==='enemy'&&!o.gone&&o.x-x<=6);
    if(foes.length){const inRange=foes.filter(e=>e.x-x<=e.range);const th=inRange.map(e=>{const [a,v]=e.pat[e.pi%e.pat.length];const m=e.elite==='fast'||e.t==='labfreak'?' ×2':'';return (a==='atk'||a==='drain')?`${e.n} ${v}${m}`:a==='jackpot'?`${e.n} 3×${v}`:a==='jam'?`${e.n} jams a reel`:a==='tax'?`${e.n} taxes 1 🪙`:null;}).filter(Boolean);
      L.push(th.length?`<span style="color:var(--red)">then foes strike: ${th.join(', ')}</span>`:`<span style="color:var(--dim)">then ${foes.length} foe${foes.length>1?'s':''} close in</span>`);}
  }
  if(!L.length)L.push('Nothing lands. Foes take their turn.');
  return `${L.map(l=>`<div>${l}</div>`).join('')}<div class="hint">${M.nudges>0?'nudge a reel ▲▼ or ':''}${S.autoResolve||M.autoBonus?'resolving…':'tap <b>RESOLVE</b>'}</div>`;
}
function showForecast(h){const f=$('#forecast');f.innerHTML=artify(h);f.classList.toggle('show',!!h);}

// The last three turns, for the death screen: what the reels dealt, what you did, what hit you.
function noteTurn(txt){const r=run;if(!r)return;r.hist=r.hist||[];if(!r.hist.length||r.hist[r.hist.length-1].n!==r.spins)r.hist.push({n:r.spins,l:[]});
  r.hist[r.hist.length-1].l.push(txt);if(r.hist.length>3)r.hist.shift();}
function hurtBy(who,amt){const r=run;r.killer=who;noteTurn(`<span style="color:var(--red)">${esc(who)} hit you for <b>${amt}</b> (${Math.max(0,r.hp)} HP left)</span>`);}
async function doTurn(R){
  const r=run,s=stats(),u=R.units,val=k=>u[k]||0;
  noteTurn(`Reels: ${Object.entries(u).map(([k,n])=>`${SYM[k]?SYM[k].e:k}×${n}`).join(' ')}${R.mult>1?` · wheel ×${R.mult}`:''}${R.triples?' · JACKPOT':''}`);
  const parts=[];const combo=R.combos||{};r.turnJackpot=R.triples>0;r.maxTriples=Math.max(r.maxTriples||0,R.triples);
  const mu=R.mult||1;r.bestMult=Math.max(r.bestMult||1,mu);if(mu>1){heroFl('FORTUNE ×'+mu,'#d9b56a');parts.push(`×${mu}`);}
  if(r.wheelJam&&R.triples){r.wheelJam=false;heroFl('wheel freed','#9fd6ff');drawWheel();}
  if(R.gain){r.bulbs=(r.bulbs||0)+R.gain;drawBulbs(true);sfx.coin();heroFl('+'+R.gain+' bulb'+(R.gain>1?'s':''),'#ff8a4a');}
  if(R.bonusTrigger){r.bulbs=0;drawBulbs();r.bonus=hasR('longstreak')?5:3;r.inBonus=true;r.bonuses=(r.bonuses||0)+1;heroFl('FREE SPINS ×'+r.bonus,'#d9b56a');
    if(S.mods.bonusbell)await relicPick('Bonus Bell','The bell rings: a relic falls with the free spins.');}

  r.block=hasR('tower')?Math.floor(r.block/2):0;
  if(R.triples){heroFl(R.triples>1?`JACKPOT x${R.triples}!`:'JACKPOT!','#d9b56a');view.shake=10;if(S.jackpotScreen!==false){jackpotFlash(R.triples);await sleep(S.fast?1800:3300);}else await sleep(500);
    if(hasR('bell'))gainCoins(3*R.triples);}
  if(val('shield')){const b=val('shield')*s.blockPer*mu;r.block+=b;parts.push(`🛡+${b}`);heroFl('+'+b+' block','#5aa9e6');sfx.block();addFx('fx_block',heroWX()+14,GY-48,64,.5);if(combo.mend)heal(Math.floor(b/2));}
  if(val('potion')){const h=heal(val('potion')*s.healPer);parts.push(`🧪+${h}`);if(r.poison){r.poison=null;heroFl('poison cured','#8cff96');}}
  if(val('coin')){const c=val('coin')*s.coinPer;gainCoins(c);parts.push(`🪙+${c}`);}
  if(val('skull')){
    if(hasR('beaker')){const ts=r.objs.filter(o=>!o.gone&&o.kind==='enemy'&&o.x>r.x).sort((a,b)=>a.x-b.x);
      if(ts.length){const d1=val('skull')*5,d2=val('skull')*3;addFx('fx_curse',ts[0].x*T+T/2,GY-50,80,.7,10);await hit(ts[0],d1,'bomb');parts.push(`⚗${d1}`);
        const t2=r.objs.filter(o=>!o.gone&&o.kind==='enemy'&&o.x>r.x&&o!==ts[0]).sort((a,b)=>a.x-b.x)[0];if(t2){addFx('fx_curse',t2.x*T+T/2,GY-50,60,.6,10);await hit(t2,d2,'bomb');parts.push(`⚡${d2}`);}}
      else parts.push('⚗ fizzles');}
    else if(hasR('skullring')){gainCoins(val('skull'));parts.push(`💍+${val('skull')}`);}
    else{const d=val('skull')*s.skullDmg;r.hp-=d;hurtBy('a Skull on the reels',d);heroFl('-'+d+' 💀','#b07cf0');addFx('fx_curse',heroWX(),GY-60,70,.8,20);view.hurt=1;sfx.hurt();parts.push(`💀-${d}`);
      r.doom=(r.doom||0)+val('skull')*(hasR('scythe')?2:1);if(r.doom>=3){heroFl('DOOM','#b07cf0');}}
  }
  ui();if(val('shield')||val('potion')||val('coin')||val('skull'))await beat(380);
  for(let i=0;i<val('key');i++){
    const ch=r.objs.find(o=>o.kind==='chest'&&!o.gone&&o.x>r.x&&o.x-r.x<=3);
    if(ch){await openChest(ch,true);parts.push('🗝️open');}else{gainCoins(1);}

      const ls=val('sword')*(hasR('fang')?1:0)+s.lifesteal;if(ls)heal(ls);

      if(hasR('quiver')&&es[1])await hit(es[1],Math.ceil(dmg/2),'bow');await beat(120);}

  }
  if(val('bomb')){
    const dmg=(val('bomb')*s.bombDmg+mom)*mu;view.boom={t:0,x:(r.x+1.5)*T};sfx.boom();view.shake=8;

    for(const t of ts)await hit(t,dmg,'bomb');parts.push(`💣${dmg}`);await beat(180);
    if(combo.stabbomb){const t2=blockerAt(r.x+1);if(t2){view.lunge=1;await hit(t2,s.swordDmg,'sword');parts.push(`🗡${s.swordDmg}`);await beat(160);}}
  }
  noteTurn('You: '+(parts.length?parts.join(' · '):'nothing landed'));logLine(parts.length?parts.join(' · '):'Nothing useful landed.');
  ui();
  await drainLoot();
  if(r.over)return;
  await beat(260);
  await enemyPhase();
  if(r.over)return;
  if(r.poison&&r.poison.turns>0&&r.hp>0){const d=r.poison.dmg;r.hp-=d;r.poison.turns--;hurtBy("Dr. Labfreak's poison",d);heroFl('-'+d+' ☣','#8cff96');view.hurt=.6;view.puff={t:0};
    if(!r.poison.turns){r.poison=null;heroFl('poison wears off','#8cff96');}ui();await beat(260);}
  if(r.hp<=0&&await tryDie())return;
  if(r.coins<1&&!r.freeSpin)await broke();
}
function heal(n){const r=run,mx=stats().maxHp;const h=Math.max(0,Math.min(n,mx-r.hp));r.hp+=h;if(h){heroFl('+'+h+' HP','#6cc070');sfx.heal();addFx('fx_heal',heroWX(),GY-50,70,.8,26);}return h;}
function gainCoins(n){if(n<=0)return;run.coins+=n;heroFl('+'+n+' 🪙','#d9b56a');sfx.coin();addFx('fx_coins',heroWX(),GY-70,56,.6,18);}
async function hit(o,dmg,how){
  const r=run;if(o.gone)return;
  if(o.kind==='chest'){
    if(o.mimic){o.gone=true;const m=mkEnemy('mimic',o.x,r.floor);m.hp=Math.max(1,m.hp-dmg);r.objs.push(Object.assign(m,{id:uid++}));
      fl('MIMIC!','#e0605a',o.x*T+T/2);view.shake=5;return;}
    o.hp-=dmg;o.flash=1;fl('-'+dmg,'#f1e6d2',o.x*T+T/2,GY-50);
    if(o.hp<=0)await openChest(o,false);return;
  }
  if(o.t==='ironclad'&&!(how==='bomb'||how==='shove'||r.turnJackpot)){fl('IMMUNE','#9aa3ad',o.x*T+T/2,GY-96);o.flash=1;return;}
  let d=dmg;if(o.block){const b=Math.min(o.block,d);o.block-=b;d-=b;if(b)fl('🛡'+b,'#5aa9e6',o.x*T+T/2,GY-96);}
  if(o.t==='mirror'&&how==='sword'&&d>0){const back=Math.min(d,1+Math.floor(r.floor/8)),bb=Math.min(r.block,back);r.block-=bb;const hd=back-bb;if(hd>0){r.hp-=hd;hurtBy('the Mirror Wight\'s reflection',hd);heroFl('-'+hd+' mirrored','#b07cf0');view.hurt=1;}}
  r.bestHit=Math.max(r.bestHit||0,d);
  o.hp-=d;o.flash=1;addFx('fx_hit',o.x*T+T/2,GY-(o.boss?80:50),o.boss?64:46,.35);fl('-'+d,how==='shove'?'#d9b48a':'#fff',o.x*T+T/2,GY-(o.boss?120:80));
  if(o.hp<=0){if(o.t==='labfreak'&&!o.phase2){await labfreakPhase2(o);return;}await kill(o);}
}
async function kill(o){
  const r=run;o.gone=true;r.kills++;S.kills++;
  const c=rnd(o.coins[0],o.coins[1])+(hasR('pouch')?1:0);gainCoins(c);
  if(r.jam&&r.jam.by===o.id){r.jam=null;rebuildReels();heroFl('reel freed','#9fd6ff');}
  if(o.t==='reaper'){const bonus=hasR('scythe')?50:25;r.souls+=bonus;fl('+'+bonus+' 💠','#9fd6ff',o.x*T+T/2,GY-140);}
  r.souls+=o.boss?15+r.floor:1+Math.floor(r.floor/2);
  fl('💠','#9fd6ff',o.x*T+T/2,GY-40);addFx('fx_souls',o.x*T+T/2,GY-50,64,1,40);
  if(Math.random()<o.loot)r.pending.push(mkItem(null,Math.max(o.minRar||0,o.boss?Math.max(2,rollRarity(20)):rollRarity()),r.floor));
  if(o.boss){r.chips++;S.chips++;fl('+1 🎰 CHIP','#d9b56a',o.x*T+T/2,GY-130);r.bossDown=true;
    if(o.t==='labfreak'){r.pending.push(...labUniques(r.floor+2));fl('4 UNIQUE DROPS','#8cff96',o.x*T+T/2,GY-150);}}
}
async function openChest(o,keyed){
  const r=run;
  if(o.mimic&&!keyed){return hit(o,0);}
  o.gone=true;o.open=true;sfx.jackpot();
  gainCoins(rnd(2,5)+Math.floor(r.floor/2));
  let rar=rollRarity(keyed?15:5);if(hasR('map'))rar=Math.max(2,rar);
  r.pending.push(mkItem(null,rar,r.floor+1));
  r.objs.push({id:uid++,kind:'openchest',x:o.x,dx:o.x*T});
}
async function enterTile(x){
  const r=run;
  for(const o of objsAt(x)){
    if(o.kind==='coins'){o.gone=true;gainCoins(o.v);}
    else if(o.kind==='trap'){o.gone=true;const s=stats();
      if(Math.random()*100<s.dodge){heroFl('dodged!','#9fd6ff');continue;}
      let d=o.dmg;const b=Math.min(r.block,d);r.block-=b;d-=b;r.hp-=d;hurtBy('a spike trap',d);heroFl('-'+d+' spikes','#e0605a');view.hurt=1;sfx.hurt();ui();
      if(r.hp<=0&&await tryDie())return;}
    else if(o.kind==='shrine'){o.gone=true;o.used=true;r.objs.push({id:uid++,kind:'shrine_used',x:o.x,dx:o.x*T});
      await relicPick('Shrine of Odds','A cracked idol offers a gift. Choose one.','portrait_shrine');}
    else if(o.kind==='door'){await floorClear();return;}
  }
}

/* ---------------- enemies ---------------- */
function intentOf(e){const [a,v]=e.pat[e.pi%e.pat.length];
  return ({atk:['⚔️',v],drain:['🩸',v],jackpot:['🎰',v+'x3'],jamwheel:['⚙️','×1'],guard:['🛡️',v],grow:['➕',v],summon:['☠️',''],steal:['🫳',v+'🪙'],curse:['💀','+1'],rest:['💤',''],jam:['🎰','jam'],tax:['🪙','-'+v]})[a]||['?',''];}
function intentText(e){const [a,v]=e.pat[e.pi%e.pat.length];
  return ({atk:`Attack for ${v}`,drain:`Drain: hit for ${v} and steal a coin`,jackpot:`Jackpot: three hits of ${v}`,guard:`Guard ${v}`,grow:`Grow +${v} HP`,summon:'Summon a skeleton',steal:`Steal ${v} coins`,curse:'Curse: add a Skull to your reels this floor',rest:'Resting',jam:'Jam one of your reels on a Skull',tax:`Tax: take ${v} coin`,jamwheel:'Jam your fortune wheel at x1 until you land a jackpot'})[a];}
async function enemyPhase(){
  const r=run;
  const es=r.objs.filter(o=>o.kind==='enemy'&&!o.gone&&o.x-r.x<=6).sort((a,b)=>a.x-b.x);
  for(const e of es){
    for(let rep=0;rep<(e.elite==='fast'||e.t==='labfreak'?2:1);rep++){
    if(r.over||r.hp<=0)return;if(e.gone)continue;
    e.block=e.elite==='shield'?5:0;
    const [a,v]=e.pat[e.pi%e.pat.length],dist=e.x-r.x;
    const needsRange=a==='atk'||a==='drain'||a==='jackpot';
    if(needsRange&&dist>e.range){
      if(!blockerAt(e.x-1)&&e.x-1>r.x){e.x--;await beat(70);}
      continue;
    }
    e.lunge=1;if(a!=='guard'&&a!=='grow'&&a!=='rest')e.pose=.5;
    if(a==='atk')await enemyHit(e,v);
    else if(a==='drain'){await enemyHit(e,v);if(r.coins>0){r.coins--;heroFl('-1 🪙','#b07cf0');}}
    else if(a==='jackpot'){for(let i=0;i<3&&r.hp>0;i++){await enemyHit(e,v);await beat(120);}}
    else if(a==='guard'){e.block=v;fl('🛡'+v,'#5aa9e6',e.x*T+T/2,GY-100);}
    else if(a==='grow'){e.hp+=v;e.max+=v;fl('+'+v,'#6cc070',e.x*T+T/2,GY-90);}
    else if(a==='summon'){let sx=e.x+1;while(r.objs.some(o=>o.x===sx&&!o.gone&&o.kind!=='door'&&o.kind!=='openchest')&&sx<r.len-1)sx++;
      if(sx<r.len&&!r.objs.some(o=>o.x===sx&&!o.gone&&(o.kind==='enemy'||o.kind==='chest'))){const m=mkEnemy(v,sx,r.floor);m.loot=0;m.coins=[0,1];r.objs.push(Object.assign(m,{id:uid++}));fl('RISE!','#e0605a',e.x*T+T/2,GY-120);
        if(e.t==='labfreak'){const ox=e.x;e.x=sx;m.x=ox;m.dx=sx*T;fl('back, my pet!','#8cff96',ox*T+T/2,GY-140);}}}
    else if(a==='steal'){const c=Math.min(r.coins,v);r.coins-=c;heroFl('-'+c+' 🪙 stolen','#b07cf0');}
    else if(a==='curse'){r.curse=(r.curse||0)+1;heroFl('+💀 on reels','#b07cf0');addFx('fx_curse',heroWX(),GY-60,76,.9,20);rebuildReels();}
    else if(a==='jam'){if(!r.jam){const free=M.reels.map((R,i)=>i).filter(i=>!M.reels[i].jam);if(free.length){r.jam={reel:pick(free),by:e.id};heroFl('REEL JAMMED','#b07cf0');rebuildReels();}}}
    else if(a==='tax'){const c=Math.min(r.coins,v);r.coins-=c;heroFl('-'+c+' 🪙 tax','#b07cf0');}
    else if(a==='jamwheel'){r.wheelJam=true;heroFl('WHEEL JAMMED ×1','#b07cf0');drawWheel();}
    e.pi++;ui();await beat(150);
    }
  }
}
async function enemyHit(e,dmg){
  const r=run,s=stats();
  if(Math.random()*100<s.dodge){heroFl('dodged!','#9fd6ff');return;}
  let d=dmg;const b=Math.min(r.block,d);r.block-=b;d-=b;
  if(b){heroFl('🛡'+b,'#5aa9e6');addFx('fx_block',heroWX()+14,GY-48,58,.4);if(d<=0)noteTurn(`${esc(e.n)} hit for ${dmg}, all blocked`);}
  if(d>0){r.hp-=d;hurtBy(e.n,d);heroFl('-'+d,'#e0605a');view.hurt=1;view.shake=4;sfx.hurt();if(e.phase2)poisonHero();if(e.elite==='cursed'){r.curse=(r.curse||0)+1;heroFl('+💀 hexed','#b07cf0');rebuildReels();}}else sfx.block();
  if(s.thorns&&e.range<=1&&!e.gone)await hit(e,s.thorns);
  ui();
}
async function tryDie(){
  const r=run;if(r.hp>0)return false;
  if(hasR('secondwind')&&!r.usedWind){r.usedWind=true;r.hp=1;heroFl('SECOND WIND','#9fd6ff');ui();return false;}
  if(hasR('beaker')&&!r.beakerRevived){r.beakerRevived=true;r.hp=Math.ceil(stats().maxHp/2);sfx.jackpot();view.shake=10;
    document.body.classList.add('labFlash');setTimeout(()=>document.body.classList.remove('labFlash'),700);
    view.banner={t:performance.now(),txt:"IT'S ALIVE!"};heroFl('+'+r.hp+' HP','#8cff96');addFx('fx_heal',heroWX(),GY-50,90,1,30);
    noteTurn(`<span style="color:#8cff96">Labfreak's Beaker: <b>IT'S ALIVE!</b> back up at ${r.hp} HP</span>`);ui();return false;}
  await endRun('slain');return true;
}
async function broke(){
  const r=run;
  while(r.coins<1&&!r.over){
    const items=SLOTS.map(s=>r.gear[s]).filter(Boolean);
    const btns=items.map(it=>({label:`Pawn ${gearIcon(it)} ${esc(it.name)} <small>+${salvageVal(it)} 🪙</small>`,val:it.slot}));
    btns.push({label:'Walk away (end run)',val:'end',cls:'danger'});
    const v=await modal('Out of coins','<p>The machine won\'t take IOUs. Pawn a piece of gear to keep spinning, or let the dungeon have you.</p>',btns);
    if(v==='end'){r.killer='an empty purse';await endRun('broke');return;}
    const it=r.gear[v];r.gear[v]=null;r.coins+=salvageVal(it);r.hp=Math.min(r.hp,stats().maxHp);rebuildReels();ui();
  }
}

/* ---------------- loot / relics / shop ---------------- */
async function drainLoot(){
  const r=run;
  while(r.pending.length&&!r.over){
    const it=r.pending.shift();const cur=r.gear[it.slot];
    const v=await modal('Loot!',itemHTML(it,'NEW')+'<div class="cmpLabel">Currently equipped</div>'+itemHTML(cur,'EQUIPPED'),[
      {label:`Equip${cur?` <small>old piece salvaged for +${salvageVal(cur)} 🪙</small>`:''}`,val:'eq',cls:'primary'},
      {label:`Salvage <small>+${salvageVal(it)} 🪙</small>`,val:'sv'}]);
    if(v==='eq'){const before=stats().maxHp;if(cur)r.coins+=salvageVal(cur);r.gear[it.slot]=it;const after=stats().maxHp;
      if(after>before)r.hp+=after-before;r.hp=Math.min(r.hp,after);rebuildReels();}
    else gainCoins(salvageVal(it));
    ui();
  }
}
function relicChoices(n){return shuffle(RELICS.filter(x=>!x.lab&&!run.relics.includes(x.id))).slice(0,n);}
async function relicPick(title,text,pk){
  const ch=relicChoices(3);if(!ch.length)return;
  const v=await modal(title,`${pk&&pk.startsWith('screen_')?(artSrc(pk)?`<img class="splash" src="${artSrc(pk)}" alt="">`:''):pk?portImg(pk,'big merch'):''}<p>${text}</p>`,ch.map(x=>({label:`${relicIcon(x,'lead')}<b>${x.n}</b><small>${x.d}</small>`,val:x.id})));
  run.relics.push(v);rebuildReels();ui();
}
async function floorClear(){
  const r=run;r.floorDone=true;
  r.souls+=5;gainCoins(2);
  if(alt('mend'))heal(alt('mend')*3);
  if(r.bossDown&&r.lab){r.bossDown=false;await drainLoot();r.souls+=50;
    if(!hasR('beaker')){const b=RELICS.find(x=>x.id==='beaker');await modal("Labfreak's Hoard",`${portImg('portrait_labfreak','big merch')}<p>Among the smashed glass, one beaker is still bubbling. It is warm. It is <i>humming</i>. +50 souls.</p>`,[{label:`${relicIcon(b,'lead')}<b>${b.n}</b><small>${b.d}</small>`,val:1}]);run.relics.push('beaker');rebuildReels();ui();}
    else await relicPick("Labfreak's Hoard",'The lab\'s shelves hold one more curiosity. +50 souls.','portrait_labfreak');}
  if(r.bossDown){r.bossDown=false;await drainLoot();await relicPick('Boss Hoard','The boss\'s hoard holds a relic.','screen_boss_hoard');}
  await drainLoot();
  if(r.floor+1>S.best&&(r.floor+1)%5===0){r.chips++;S.chips++;}
  S.best=Math.max(S.best,r.floor);
  await shop();
  r.nextKind='fight';
  if((r.floor+1)%3!==0){
    const others=shuffle(['treasure','elite','rest']).slice(0,2);const opts=['fight',...others];
    const v=await modal('The way down',`<p>Three doors. Coins are time: choose your floor.</p>`,
      opts.map(k=>({label:`${icon('map_'+k,FLOOR_KINDS[k].e,'lead')}<b>${FLOOR_KINDS[k].n}</b><small>${FLOOR_KINDS[k].d}</small>`,val:k})));
    r.nextKind=v||'fight';
  }
  r.floor++;genFloor(r.floor);rebuildReels();ui();save();music.play(musicForFloor(r.floor));
  logLine(`<b>Floor ${r.floor} · ${FLOOR_KINDS[r.kind].n}.</b> ${FLOOR_KINDS[r.kind].d}`);
}
function shopOffers(){
  const f=run.floor,o=[{t:'heal',price:3+Math.floor(f/3)}];
  for(let i=0;i<2;i++){const rar=Math.max(1,rollRarity(10));o.push({t:'gear',item:mkItem(null,rar,f+1),price:5+rar*4+Math.floor(f/2)});}
  const rl=relicChoices(1)[0];if(rl)o.push({t:'relic',relic:rl,price:12+f*2});
  const addable=['sword','boots','shield','coin','potion','bow','bomb','key'];
  shuffle(addable);o.push({t:'add',sym:addable[0],price:4},{t:'add',sym:addable[1],price:4});
  o.push({t:'remove',price:5},{t:'maxhp',price:8+f});
  return o;
}
async function shop(){
  const r=run,offers=shopOffers();
  while(true){
    const desc=o=>({heal:`${icon('shop_meal','🍖','lead')}Hot meal <small>Heal ${Math.round(stats().maxHp*.4)} HP</small>`,
      gear:`${o.item?gearIcon(o.item,'lead'):''}<b style="color:${o.item?RAR[o.item.rar].c:''}">${o.item?esc(o.item.name):''}</b><small>${o.item?o.item.affs.map(affText).join(' · '):''}</small>`,
      relic:`${o.relic?relicIcon(o.relic,'lead'):''}<b>${o.relic?o.relic.n:''}</b><small>${o.relic?o.relic.d:''}</small>`,
      add:`${icon('shop_weld','➕','lead')}Weld a ${SYM[o.sym]?symIcon(o.sym):''} ${SYM[o.sym]?SYM[o.sym].n:''} onto the reels`,
      remove:`${icon('shop_pry','➖','lead')}Pry one symbol off the reels`,maxhp:`${icon('shop_tonic','❤️','lead')}Tonic <small>+5 max HP</small>`})[o.t];
    const btns=offers.map((o,i)=>({label:o.sold?`<s>${desc(o)}</s>`:`${desc(o)}<span class="price">🪙${o.price}</span>`,val:i,disabled:o.sold||r.coins<o.price}));
    btns.push({label:'Descend ▶',val:'go',cls:'primary'});
    const v=await modal(`The Coin-Op Merchant · 🪙 ${r.coins}`,`<div class="merchCol">${portImg('portrait_merchant','big')}<button class="peekBtn" onclick="peekInventory()">${icon('ui_bag','🎒')} My gear</button></div>`+'<p>Every coin you spend here is a spin you won\'t get. Choose carefully.</p>',btns);
    if(v==='go')return;
    const o=offers[v];if(!o||o.sold||r.coins<o.price)continue;
    if(o.t==='remove'){
      const c=stripCounts();const keys=Object.keys(c);
      const s=await modal('Pry a symbol off',reelTable(),keys.map(k=>({label:`${symIcon(k,'lead')}${SYM[k].n} <small>${c[k]} on each reel</small>`,val:k})).concat([{label:'Never mind',val:null}]));
      if(!s)continue;run.stripAdd[s]=(run.stripAdd[s]||0)-1;
    }
    r.coins-=o.price;o.sold=true;
    if(o.t==='heal')heal(Math.round(stats().maxHp*.4));
    if(o.t==='gear'){r.pending.push(o.item);await drainLoot();}
    if(o.t==='relic')r.relics.push(o.relic.id);
    if(o.t==='add')run.stripAdd[o.sym]=(run.stripAdd[o.sym]||0)+1;
    if(o.t==='maxhp'){r.bonusHp=(r.bonusHp||0)+5;r.hp+=5;}
    rebuildReels();ui();
  }
}

/* ---------------- end of run ---------------- */
async function endRun(reason){
  const r=run;if(r.over)return;r.over=true;busy=false;
  M.timers.forEach(clearTimeout);M.spinning=false;
  const souls=Math.round(r.souls*(1+stats().soulFind/100));
  S.souls+=souls;S.runs++;S.best=Math.max(S.best,r.floor);
  if(r.daily){const d=(S.daily&&S.daily[r.daily])||{best:0,runs:0,souls:0};d.best=Math.max(d.best,r.floor);d.runs++;d.souls=Math.max(d.souls,souls);S.daily={[r.daily]:d};}
  seedRandom(null);
  r.summary=`Dead Man's Pull${r.daily?' · Daily '+r.daily:''}\n${HEROES[r.hero].n} ${reason==='broke'?'went bust':'fell'} on floor ${r.floor}\n${r.kills} kills · ${r.spins} spins · best jackpot ${r.maxTriples?'x3'+(r.maxTriples>1?' on '+r.maxTriples+' lines':''):'none'} · biggest hit ${r.bestHit||0} · best fortune x${r.bestMult||1} · ${r.bonuses||0} bonus round${(r.bonuses||0)===1?'':'s'}\nRelics: ${r.relics.map(id=>RELIC[id].n).join(', ')||'none'}\nSouls banked: ${souls}\nhttps://labfreak-dev.github.io/Odds-Ends/lootdaggers/`;
  S.run=null;save();
  const ps=artSrc('portrait_'+r.hero);
  const hist=(r.hist||[]).map(t=>`<div class="histTurn"><span class="tn">Spin ${t.n}</span>${t.l.map(x=>`<div>${x}</div>`).join('')}</div>`).join('')||'<div class="histTurn">No turns recorded.</div>';
  const killer=reason==='broke'?'an empty purse':reason==='quit'?'your own cowardice':(r.killer||'the dungeon');
  await modal('',
    `${artSrc(reason==='broke'?'screen_busted':'screen_death')?`<img class="splash" src="${artSrc(reason==='broke'?'screen_busted':'screen_death')}" alt="">`:''}
     <div class="deathTitle">${reason==='quit'?'The House Remembers':'The Dead Can\'t Pay Their Debts!'}</div>
     <div class="deathBy">Death by <b>${esc(killer)}</b></div>
     ${ps?`<img class="port big dead" src="${ps}" alt="">`:''}<p>${reason==='broke'?'Your purse is empty. The dungeon keeps the change — and you.':reason==='quit'?'You walked away from the machine.':'The dungeon claims another gambler.'}</p>
     <details class="hist"><summary>What happened: the last ${(r.hist||[]).length||3} turns</summary>${hist}</details>
     <p>Reached <b>floor ${r.floor}</b> · ${r.kills} kills · ${r.spins} spins</p>
     <p style="font-size:16px">Banked <b style="color:#9fd6ff">${icon('ui_souls_big','💠','gi')} ${souls} souls</b>${r.chips?` and <b style="color:var(--gold)">🎰 ${r.chips} chip${r.chips>1?'s':''}</b>`:''}</p>
     <p class="sub" style="font-size:12px;color:var(--dim)">Best jackpot ${r.maxTriples?'x3'+(r.maxTriples>1?' on '+r.maxTriples+' lines':''):'none'} · biggest hit ${r.bestHit||0} · ${r.relics.length} relic${r.relics.length===1?'':'s'}${r.daily?` · <b style="color:var(--gold)">Daily ${r.daily}</b>`:''}</p>`,
    [{label:'Continue',val:1,cls:'primary'},{label:'📋 Copy run summary',val:'copy'}]).then(async v=>{if(v==='copy'){try{await navigator.clipboard.writeText(r.summary);}catch(e){}}});
  const eq=SLOTS.map(s=>r.gear[s]).filter(Boolean);
  if(eq.length){
    const v=await modal('The Vault',`<p>Carry one piece home as an <b>heirloom</b>. Heirlooms can be worn at the start of any run.</p><p class="sub">Vault: ${S.vault.length}/${vaultSlots()}</p>`+eq.map(it=>itemHTML(it)).join(''),
      eq.map(it=>({label:`Keep ${gearIcon(it)} ${esc(it.name)}`,val:it.id})).concat([{label:'Keep nothing',val:null}]));
    if(v){const it=eq.find(x=>x.id===v);
      if(S.vault.length<vaultSlots())S.vault.push(it);
      else{const rep=await modal('Vault full','<p>Replace which heirloom?</p>',S.vault.map((x,i)=>({label:`${gearIcon(x)} ${esc(x.name)} <small>${RAR[x.rar].n}</small>`,val:i})).concat([{label:'Keep the old ones',val:-1}]));
        if(rep>=0){S.loadout=S.loadout.filter(id=>id!==S.vault[rep].id);S.vault[rep]=it;}}
    }
  }
  run=null;save();showHub('main');
}

/* ---------------- modal ---------------- */
let modalOpen=false;
function modal(title,html,buttons){
  return new Promise(res=>{
    const m=$('#modal');modalOpen=true;
    const A=window.LD_ART||{};
    m.innerHTML=`<div class="mbox ${A.ui_panel?'art':''}" ${A.ui_panel?`style="border-image-source:url(${A.ui_panel})"`:''}><h2>${artify(title)}</h2><div class="mbody">${artify(html)}</div><div class="mbtns"></div></div>`;
    const bb=m.querySelector('.mbtns');
    buttons.forEach(b=>{const el=document.createElement('button');el.className='btn '+(b.cls||'');if((b.cls||'').includes('ooze')&&A.ui_ooze_button)el.classList.add('hasArt');el.innerHTML=artify(b.label);el.disabled=!!b.disabled;
      if(A.ui_button&&!(b.cls||'').includes('primary')){el.classList.add('art');el.style.borderImageSource=`url(${A.ui_button})`;el.innerHTML=`<span class="lbl">${el.innerHTML}</span>`;
        const lbl=el.firstElementChild,price=lbl.querySelector('.price');if(price)el.appendChild(price),el.classList.add('hasPrice');
        const lead=lbl.querySelector('.ico.lead');const txt=document.createElement('span');txt.className='txt';
        while(lbl.firstChild){const n=lbl.firstChild;if(n===lead){lbl.removeChild(n);continue;}txt.appendChild(n);}
        if(lead)lbl.appendChild(lead);lbl.appendChild(txt);}
      el.onclick=()=>{m.classList.remove('show');modalOpen=false;res(b.val);};bb.appendChild(el);});
    m.classList.add('show');m.querySelector('.mbox').scrollTop=0;
  });
}
// A pop-up over the current modal showing worn gear and relics, closed by its X.

  if(!el){el=document.createElement('div');el.id='peek';$('#app').appendChild(el);el.addEventListener('click',e=>{if(e.target===el||e.target.id==='peekX')el.classList.remove('show');});}

// Full screen: the browser's fullscreen API (Android Chrome hides the address bar
// and the phone's buttons). Browsers drop it on every reload, so with the setting on
// the first tap after loading asks for it again. Leaving it with the phone's back
// gesture turns the setting off, so it never fights the player.
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const fsCan=()=>!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
function fsEnter(){const d=document.documentElement,f=d.requestFullscreen||d.webkitRequestFullscreen;if(!f||fsEl())return;try{const p=f.call(d,{navigationUI:'hide'});if(p&&p.catch)p.catch(()=>{});}catch(e){}}
function fsExit(){const f=document.exitFullscreen||document.webkitExitFullscreen;if(f&&fsEl()){try{const p=f.call(document);if(p&&p.catch)p.catch(()=>{});}catch(e){}}}
function fsRefresh(){document.querySelectorAll('[data-act="set:fullscreen"] small').forEach(el=>el.textContent=S.fullscreen?'on':'off · hides the browser bars');}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&S.fullscreen){S.fullscreen=false;save();}fsRefresh();setTimeout(()=>window.dispatchEvent(new Event('resize')),60);}));
document.addEventListener('pointerup',()=>{if(S.fullscreen&&!fsEl())fsEnter();},true);
function applySetting(arg){S[arg]=!S[arg];save();if(arg==='fullscreen'){if(S.fullscreen)fsEnter();else fsExit();}if(arg==='music')music.apply();if(arg==='autoStop'&&run)ui();}

    <h2>Settings</h2><div class="mbody"><div class="hubBtns" id="setList">${artify(settingsHTML())}</div></div></div>`;};
  render();el.classList.add('show');

    const b=e.target.closest('[data-act^="set:"]');if(!b)return;applySetting(b.dataset.act.split(':')[1]);const st=el.querySelector('.mbox').scrollTop;render();el.querySelector('.mbox').scrollTop=st;};

// Chiselled lettering for the gravestones, built once per name/size/zoom on a
// spare canvas: a recessed body that darkens the stone (its texture shows
// through), a shadow on the upper-left inner walls, a light catch on the
// lower-right walls where the torchlight hits, and a few chips of wear.
const ENGRAVE={};
function engraving(lines,fs,dark){
  const txt=lines.join(' '),lh=fs*.92,k=Math.max(2,Math.round(scaleK*2)/2),key=lines.join('/')+'|'+fs+'|'+k+'|'+dark;
  if(ENGRAVE[key])return ENGRAVE[key];
  const font=`${fs}px 'Pirata One',serif`;cx.save();cx.font=font;const tw=Math.max(...lines.map(l=>cx.measureText(l).width));cx.restore();
  const w=tw+fs*1.2,h=fs*.9+lh*lines.length,W=Math.ceil(w*k),H=Math.ceil(h*k);
  const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.scale(k,k);g.font=font;g.textAlign='center';g.textBaseline='middle';return [c,g];};
  const [m,mg]=mk();mg.fillStyle='#fff';lines.forEach((l,i)=>mg.fillText(l,w/2,h/2+(i-(lines.length-1)/2)*lh));
  // letters with the text shifted by (dx,dy) cut away: a band along one side of every stroke
  const band=(dx,dy,col)=>{const [c,g]=mk();g.setTransform(1,0,0,1,0,0);g.drawImage(m,0,0);g.globalCompositeOperation='destination-out';g.drawImage(m,dx*k,dy*k);
    g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,W,H);return c;};
  const [out,og]=mk();og.setTransform(1,0,0,1,0,0);
  og.drawImage(m,0,0);og.globalCompositeOperation='source-in';og.fillStyle=dark?'rgba(0,0,0,.92)':'rgba(24,15,10,.9)';og.fillRect(0,0,W,H);
  og.globalCompositeOperation='source-over';
  og.drawImage(band(.55,.7,dark?'rgba(0,0,0,1)':'rgba(6,4,2,.95)'),0,0);            // shadowed upper-left walls
  og.drawImage(band(-.45,-.55,dark?'rgba(225,220,205,.85)':'rgba(255,250,238,.95)'),0,0); // lit lower-right walls
  // weathering: a few chips knocked out of the letters, the same every time for a name
  og.globalCompositeOperation='destination-out';let sd=0;for(const ch of txt)sd=(sd*31+ch.charCodeAt(0))>>>0;
  for(let i=0;i<Math.round(tw*lines.length/10);i++){sd=(sd*1103515245+12345)>>>0;const px=(sd%1000)/1000*W;sd=(sd*1103515245+12345)>>>0;const py=(sd%1000)/1000*H;

}
function drawProp(o,x,t){

      const g=graveDef(o.who),gt=GRAVE_TXT[o.who]||{x:.5,y:.5,w:.5},ty=Y+FEET_SINK-d.h*gt.y,tx=x+d.w*((gt.x||.5)-.5),lines=gt.L||[g.n];
      let fs=15;const widest=()=>{cx.font=`${fs}px 'Pirata One',serif`;return Math.max(...lines.map(l=>cx.measureText(l).width));};

      if(!graveRead(o.who)||(o.who==='labfreak')){const p=.45+Math.sin(t*3+o.x)*.35;const gg=cx.createRadialGradient(x,Y-d.h-6,1,x,Y-d.h-6,14);gg.addColorStop(0,`rgba(140,255,150,${p})`);gg.addColorStop(1,'rgba(140,255,150,0)');cx.fillStyle=gg;cx.fillRect(x-16,Y-d.h-22,32,32);}
      break;}
    case 'coins':if(!sprAt('coinpile',x,Y+2)){for(let i=0;i<Math.min(5,o.v+1);i++){cx.fillStyle='#b8862a';cx.beginPath();cx.ellipse(x-10+i*5,Y-4-(i%2)*5,6,4,0,0,7);cx.fill();cx.fillStyle='#d9b56a';cx.beginPath();cx.ellipse(x-10+i*5,Y-5-(i%2)*5,5,3,0,0,7);cx.fill();}}break;
  }
}
let lastT=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;const t=now/1000;
  tickReels(now,dt);
  if(run&&!$('#game').classList.contains('hidden')&&cv.width){
    const r=run;
    const target=r.x*T+T/2;const moving=Math.abs(view.hx-target)>1;
    view.hx+=(target-view.hx)*Math.min(1,dt*(S.fast?12:5));
    view.cam+=(view.hx-HERO_SX-view.cam)*Math.min(1,dt*6);
    for(const o of r.objs){o.dx+=(o.x*T-o.dx)*Math.min(1,dt*(S.fast?12:5));if(o.flash)o.flash=Math.max(0,o.flash-dt*5);if(o.lunge)o.lunge=Math.max(0,o.lunge-dt*(S.fast?5:2.5));if(o.pose)o.pose=Math.max(0,o.pose-dt*(S.fast?1:.6));}
    view.lunge=Math.max(0,view.lunge-dt*(S.fast?5:2.5));view.hurt=Math.max(0,view.hurt-dt*2.5);view.shake=Math.max(0,view.shake-dt*30);
    cx.setTransform(scaleK,0,0,scaleK,0,0);cx.translate(0,VHd-VH);
    const sx=view.shake?(Math.random()-.5)*view.shake:0,sy=view.shake?(Math.random()-.5)*view.shake:0;
    cx.translate(sx,sy);
    const cam=view.cam;
    drawBG(cam,t);
    const vis=o=>!o.gone||o.kind==='openchest'||o.kind==='shrine_used';
    for(const o of r.objs)if(vis(o)&&o.kind!=='enemy'&&!o.gone){const x=o.dx+T/2-cam;if(x>-80&&x<VWd+80)drawProp(o,x,t);}
    for(const o of r.objs)if(o.kind==='enemy'&&!o.gone){const x=o.dx+T/2-cam;if(x>-80&&x<VWd+80)drawEnemy(o,x,t);}

      cx.globalAlpha=p<.2?p*5:1-(p-.2)/.8;cx.drawImage(im,f.x-cam-sc/2,f.y-f.rise*p-sc/2,sc,sc*im.naturalHeight/im.naturalWidth);}

    if(view.slash){view.slash.t+=dt*4;const x=view.slash.x-cam+10;cx.strokeStyle=`rgba(255,255,255,${1-view.slash.t})`;cx.lineWidth=4;cx.beginPath();cx.arc(x,GY-34,26,-1.4+view.slash.t,.6+view.slash.t);cx.stroke();if(view.slash.t>=1)view.slash=null;}
    if(view.arrow&&artImg('fx_arrow')){view.arrow.t+=dt*5;const p=Math.min(1,view.arrow.t),im=ART.fx_arrow,w=40,x=view.arrow.x0+(view.arrow.x1-view.arrow.x0)*p-cam;
      if(p<1)cx.drawImage(im,x-w/2,GY-46,w,w*im.naturalHeight/im.naturalWidth);if(view.arrow.t>=1.2)view.arrow=null;}
    if(view.arrow){view.arrow.t+=dt*5;const p=Math.min(1,view.arrow.t);const x=view.arrow.x0+(view.arrow.x1-view.arrow.x0)*p-cam;rect(x-10,GY-38,20,2,'#d9c9a0');rect(x+8,GY-40,4,6,'#ccc');if(view.arrow.t>=1.2)view.arrow=null;}
    if(view.boom&&artImg('fx_explosion')){view.boom.t+=dt*2.5;const p=Math.min(1,view.boom.t),im=ART.fx_explosion,sz=70+p*80;cx.globalAlpha=1-p*p;
      cx.drawImage(im,view.boom.x-cam-sz/2,GY-30-sz*.6,sz,sz*im.naturalHeight/im.naturalWidth);cx.globalAlpha=1;if(p>=1)view.boom=null;}
    if(view.boom){view.boom.t+=dt*3;const p=view.boom.t;cx.fillStyle=`rgba(255,${160-p*100},60,${1-p})`;cx.beginPath();cx.arc(view.boom.x-cam,GY-24,20+p*70,0,7);cx.fill();if(p>=1)view.boom=null;}

    if(view.hurt>0){cx.fillStyle=`rgba(200,30,30,${view.hurt*.25})`;cx.fillRect(0,0,VWd,VHd);}
    rect(8,8,VWd-16,4,'rgba(0,0,0,.5)');rect(8,8,(VWd-16)*clamp(r.x/r.len,0,1),4,'#d9b56a');
    if(view.banner){const bt=(now-view.banner.t)/1000;if(bt<2.2){const a=Math.min(1,bt*3,(2.2-bt)*2);cx.globalAlpha=a;cx.fillStyle='rgba(0,0,0,.6)';cx.fillRect(0,VHd/2-40,VWd,32);

// canvas text with the art icons swapped in for their emoji, centred on x
const FL_ICONS=[['🪙','ui_coin'],['💠','ui_souls'],['🎰','ui_chips'],['💀','sym_skull'],['🛡','ui_block']];
function drawRich(txt,x,y,col){
  const parts=[];let rest=txt;
  while(rest){let best=null;for(const [e,k] of FL_ICONS){const i=rest.indexOf(e);if(i>=0&&artImg(k)&&(!best||i<best.i))best={i,e,k};}
    if(!best){parts.push(rest);break;}if(best.i)parts.push(rest.slice(0,best.i));parts.push({k:best.k});rest=rest.slice(best.i+best.e.length).replace(/^\uFE0F/,'');}
  const W=p=>typeof p==='string'?cx.measureText(p).width:15;let tw=parts.reduce((a,p)=>a+W(p),0),cx0=x-tw/2;
  cx.textAlign='left';
  for(const p of parts){if(typeof p==='string'){cx.fillStyle='#000';cx.fillText(p,cx0+1,y+1);cx.fillStyle=col;cx.fillText(p,cx0,y);}else cx.drawImage(ART[p.k],cx0,y-12,15,15);cx0+=W(p);}
  cx.textAlign='center';
}
